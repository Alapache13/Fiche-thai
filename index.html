<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fiche thaï">
<title>Fiche de vocabulaire thaï · v6</title>
<style>
  :root{
    --bg:#f2f2f7; --panel:#fff; --ink:#1c1c1e; --mut:#6e6e73; --line:#d8d8de;
    --acc:#0a63ff; --ok:#1f9d55; --bad:#d93025; --warn:#e08a00; --gut:96px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.3 -apple-system,system-ui,"Helvetica Neue",sans-serif;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  input,textarea{-webkit-user-select:text;user-select:text}
  #app{display:flex;flex-direction:column;height:100%;height:100dvh}

  /* ---------- barre ---------- */
  #bar{flex:none;background:var(--panel);border-bottom:1px solid var(--line);
    padding:max(6px,env(safe-area-inset-top)) 10px 6px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;z-index:10}
  .grp{display:flex;align-items:center;gap:4px}
  .sep{width:1px;align-self:stretch;background:var(--line);margin:2px 2px}
  button,select{font:inherit;font-size:14px;min-height:40px;padding:0 11px;border:1px solid var(--line);
    border-radius:10px;background:#fff;color:var(--ink);touch-action:manipulation}
  select{max-width:210px}
  button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
  button:disabled{opacity:.35}
  button:active{filter:brightness(.93)}
  .sw{width:40px;padding:0;position:relative}
  .sw i{position:absolute;inset:10px;border-radius:50%;background:var(--c)}
  .sw.on{background:#fff;border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
  #stats{font-size:13px;color:var(--mut);white-space:nowrap}
  #saveInd{font-size:13px;color:var(--ok);min-width:16px;text-align:center}
  #saveInd.busy{color:var(--warn)} #saveInd.err{color:var(--bad)}
  #bMenu{position:relative}
  #bMenu.alert::after{content:"";position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--bad)}

  /* ---------- feuille ---------- */
  #sheet{flex:1;min-height:0;overflow:auto;padding:10px;position:relative}
  #stage{display:inline-flex;flex-direction:column;gap:18px;min-width:min-content;transform-origin:0 0}
  .band{display:flex;flex-direction:column;gap:4px}
  .brow{display:flex;align-items:stretch;gap:4px}
  .gut{flex:none;width:var(--gut);display:flex;align-items:center;justify-content:center;gap:3px}
  .gut button{min-height:0;height:30px;width:28px;padding:0;font-size:13px;border-radius:8px;box-shadow:none}
  .gut .rn{font-weight:600;color:var(--mut)}
  .gut .rn.miss{border-color:var(--warn);color:var(--warn);background:#fff6e5}
  .gut .st.s1{background:#e6f6ec;border-color:#b6e2c6;color:var(--ok);font-weight:700}
  .gut .st.s2{background:#fde8e6;border-color:#f3b9b4;color:var(--bad);font-weight:700}
  .gut .sp{opacity:.45} .gut .sp.has{opacity:1}
  .chd{flex:none;height:30px;background:#2c3e50;color:#fff;border-radius:8px;display:flex;align-items:center;
    justify-content:center;font-size:12px;font-weight:600;position:relative;white-space:nowrap;padding:0 6px}
  .chd span{overflow:hidden;text-overflow:ellipsis}
  .chd.flash{animation:fl .5s ease}
  @keyframes fl{40%{background:#1abc9c}}
  .rsz{position:absolute;top:0;bottom:0;right:-10px;width:20px;z-index:3;cursor:col-resize;touch-action:none}
  .rsz::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:4px;border-radius:2px;background:#c4c8d2}
  .rsz.drag::before,.rsz:hover::before{background:var(--acc)}
  .cell{flex:none;position:relative;border-radius:8px;box-shadow:0 0 0 1px var(--line)}
  canvas.cv{display:block;touch-action:none;background:#fff;border-radius:8px}
  .mask{position:absolute;inset:0;border-radius:8px;background:#e9e9ef;display:none;align-items:center;justify-content:center;
    color:var(--mut);font-size:13px;touch-action:pan-x pan-y;cursor:pointer}
  .addrow{align-self:flex-start;margin-left:calc(var(--gut) + 4px)}

  /* ---------- modale / toast ---------- */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  #modal.open{display:flex}
  .mbox{background:#fff;border-radius:16px;padding:16px;width:min(560px,100%);max-height:90vh;display:flex;flex-direction:column}
  .mbox h3{margin:0 0 10px;font-size:17px}
  .mbody{overflow:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:10px}
  .macts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
  .mbody p{margin:0;color:var(--mut);font-size:13px}
  .mbody textarea,.mbody input[type=file]{width:100%;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:10px}
  .sec{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
  .btns{display:flex;flex-wrap:wrap;gap:6px}
  .srow{display:flex;gap:6px;align-items:center}
  .srow .nm{flex:1;text-align:left}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:rgba(28,28,30,.92);color:#fff;
    padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%)}
  body.hasSel #toast{bottom:84px}
  #selbar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:none;align-items:center;gap:8px;
    background:rgba(28,28,30,.94);color:#fff;padding:8px 10px 8px 14px;border-radius:14px;font-size:14px;z-index:40;white-space:nowrap}
  #selbar.on{display:flex}
  #dbg{display:none;position:fixed;left:8px;bottom:8px;margin:0;padding:6px 8px;background:rgba(0,0,0,.78);color:#9ef59e;
    font:11px/1.35 ui-monospace,Menlo,monospace;border-radius:8px;z-index:70;pointer-events:none;max-width:90vw}
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="grp"><select id="selSheet" title="Feuille"></select><button id="bSheets" title="Gérer les feuilles">📚</button><button id="bFinish" title="Terminer la feuille / réviser"></button><button id="bRev" title="Tableau de bord des révisions"></button></div>
    <span class="sep"></span>
    <div class="grp"><button id="bPrev">◀</button><select id="selView" title="Vue"></select><button id="bNext">▶</button><button id="bReveal"></button></div>
    <span class="sep"></span>
    <div class="grp" id="tools">
      <button data-tool="pen">✏️ Stylo</button><button data-tool="erase">🧽 Gomme</button><button data-tool="lasso" title="Entourer à main levée puis déplacer">〰️ Lasso</button><button data-tool="rect" title="Cadre rectangulaire puis déplacer">⬚ Cadre</button><button data-tool="cell" title="Toucher une cellule pour la vider">🗑 Cellule</button>
    </div>
    <div class="grp" id="colors">
      <button class="sw" data-c="#1c1c1e" style="--c:#1c1c1e"><i></i></button>
      <button class="sw" data-c="#0a4fd6" style="--c:#0a4fd6"><i></i></button>
      <button class="sw" data-c="#c62828" style="--c:#c62828"><i></i></button>
    </div>
    <div class="grp" id="widths">
      <button data-w="1.6">Fin</button><button data-w="2.4">Moyen</button><button data-w="3.6">Épais</button>
    </div>
    <span class="sep"></span>
    <div class="grp"><button id="bUndo" title="Annuler">↶</button><button id="bRedo" title="Rétablir">↷</button></div>
    <span class="sep"></span>
    <div class="grp"><button id="bZm">−</button><button id="bFit" title="Ajuster à la largeur de l'écran">Ajuster <span id="zoomLbl">100%</span></button><button id="bZp">＋</button><button id="bLock" title="Verrouiller le zoom">🔓</button></div>
    <button id="bFinger"></button>
    <button id="bFilter"></button>
    <span id="stats"></span><span id="saveInd" title="État de la sauvegarde">✓</span>
    <button id="bMenu">⋯</button>
  </header>
  <div id="sheet"><div id="stage"></div></div>
</div>
<div id="modal"><div class="mbox"></div></div>
<div id="selbar"><span>↔ Glisse dans le cadre pour déplacer</span><button id="sbDel" class="bad">🗑 Supprimer</button><button id="sbOk" class="on">✓ OK</button></div>
<div id="toast"></div>
<pre id="dbg"></pre>

<script>
(()=>{
"use strict";

/* ═══════════════ constantes ═══════════════ */
const NS="ficheThaiV5";
const GUT=96, PAD=10, MAXGROW=1000, MINW=120, MAXW=2000;
const DEF_COLW={1:340,2:340,3:340,4:340,5:340,6:340,7:450,8:450};
const LABELS={1:"1. Thaï",2:"2. Français",3:"3. Thaï",4:"4. Français",5:"5. Thaï",6:"6. Français",7:"7. Phrase thaïe",8:"8. Phrase française"};
const BANDS=[[1,2,3,4],[7,8,5,6]];
const VIEWS=[
  {name:"Complet",bands:BANDS},
  {name:"1+2 (thaï→fr)",pair:[1,2]},
  {name:"2+3 (fr→thaï)",pair:[2,3]},
  {name:"3+4 (thaï→fr)",pair:[3,4]},
  {name:"4+7 (fr→phrase)",pair:[4,7]},
  {name:"7+8 (phrase thaï→fr)",pair:[7,8]},
  {name:"8+5 (phrase fr→thaï)",pair:[8,5]},
  {name:"5+6 (thaï→fr)",pair:[5,6]},
  {name:"Comparer 1 ↔ 3 (thaï)",cmp:[1,3]},
  {name:"Comparer 3 ↔ 5 (thaï)",cmp:[3,5]}
];
const FILTERS=["Toutes les lignes","À revoir (≠ ✓)","Erreurs (✗)"];
const STG=["·","✓","✗"];
const COL_A="#2f6fe4", COL_B="#d93025";

/* ═══════════════ état ═══════════════ */
const S={colW:{...DEF_COLW},rowH:72,guides:true,autoGrow:true,simple:false,fingerMode:"scroll",
  tool:"pen",color:"#1c1c1e",width:2.4,view:0,sheet:null,filter:0,lastExport:0,log:{},goal:10};
let sheets=[], cur=null;
let Z=1, zoomMode="fit";
let answerHidden=false; const revealed=new Set();
let recs=[], hdrs=[], guts=[]; const recMap=new WeakMap();
let undoStack=[], redoStack=[];
let sel=null;   // sélection du lasso
let seq=0; const nextId=()=>Date.now()*100+((seq++)%100);

const $=id=>document.getElementById(id);
let diag=false; const dlines=[]; let dlast=0;
function dlogRaw(t){ if(!diag) return; dlines.push(t); if(dlines.length>10) dlines.shift(); $("dbg").textContent=dlines.join("\n"); }
(()=>{let hb=performance.now(); setInterval(()=>{const n=performance.now(),gap=n-hb-100; hb=n; if(gap>120) dlogRaw("⚠ gel de l'écran "+Math.round(gap)+" ms");},100);})();
function dlog(e,tag){
  if(!diag) return;
  const t=Math.round(e.timeStamp);
  dlines.push(tag+" "+e.pointerType+"#"+e.pointerId+" b"+e.buttons+" p"+(e.pressure||0).toFixed(2)+" actif="+(active?1:0)+" +"+(t-dlast)+"ms");
  dlast=t; if(dlines.length>10) dlines.shift();
  $("dbg").textContent=dlines.join("\n");
}
const el=(t,c,x)=>{const e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e;};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const r1=v=>Math.round(v*10)/10;
const ck=(col,row)=>col+"_"+row;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sc=$("sheet"), stage=$("stage");

function newSheet(name){return {id:uid(),name,nRows:10,cells:{},rows:{},rev:null,t:Date.now()};}
function cellOf(sh,key,create){let c=sh.cells[key]; if(!c&&create){c=sh.cells[key]={s:[]};} return c;}
function pruneCell(sh,key){const c=sh.cells[key]; if(c&&!c.s.length&&!c.bg) delete sh.cells[key];}
function rowInfo(r){return cur.rows[r]||(cur.rows[r]={st:0,ref:"",fr:""});}

/* ═══════════════ toast ═══════════════ */
let toastT=null;
function toast(msg,ms){const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),ms||2400);}

/* ═══════════════ stockage (IndexedDB, repli mémoire) ═══════════════ */
const store={mode:"idb",db:null,mem:new Map(),
  keys(prefix){
    if(this.mode==="mem") return Promise.resolve([...this.mem.keys()].filter(k=>k.startsWith(prefix)));
    return new Promise((res,rej)=>{const q=this.db.transaction("kv").objectStore("kv").getAllKeys(IDBKeyRange.bound(prefix,prefix+"￿")); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);});
  },
  rangeAll(prefix){
    if(this.mode==="mem"){const o={}; for(const [k,v] of this.mem) if(k.startsWith(prefix)) o[k.slice(prefix.length)]=v; return Promise.resolve(o);}
    return new Promise((res,rej)=>{
      const os=this.db.transaction("kv").objectStore("kv"),rg=IDBKeyRange.bound(prefix,prefix+"￿");
      const kq=os.getAllKeys(rg),vq=os.getAll(rg); vq.onerror=()=>rej(vq.error);
      vq.onsuccess=()=>{const o={}; kq.result.forEach((k,i)=>{o[String(k).slice(prefix.length)]=vq.result[i];}); res(o);};
    });
  },
  batch(ops){ // ops : ["put",clé,valeur] ou ["del",clé] — une seule transaction (tout ou rien)
    if(this.mode==="mem"){ops.forEach(o=>o[0]==="put"?this.mem.set(o[1],o[2]):this.mem.delete(o[1])); return Promise.resolve();}
    return new Promise((res,rej)=>{
      const tx=this.db.transaction("kv","readwrite"),os=tx.objectStore("kv");
      ops.forEach(o=>o[0]==="put"?os.put(o[2],o[1]):os.delete(o[1]));
      tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error);
    });
  },
  async open(){
    try{
      if(!("indexedDB" in window)) throw new Error("no idb");
      const p=new Promise((res,rej)=>{
        const r=indexedDB.open(NS,1);
        r.onupgradeneeded=()=>r.result.createObjectStore("kv");
        r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); r.onblocked=()=>rej(new Error("blocked"));
      });
      this.db=await Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),3000))]);
    }catch(e){console.warn("IndexedDB indisponible",e); this.mode="mem";}
  },
  get(k){
    if(this.mode==="mem") return Promise.resolve(this.mem.get(k));
    return new Promise((res,rej)=>{const q=this.db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);});
  },
  put(k,v){
    if(this.mode==="mem"){this.mem.set(k,v); return Promise.resolve();}
    return new Promise((res,rej)=>{const tx=this.db.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k);
      tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error);});
  },
  del(k){
    if(this.mode==="mem"){this.mem.delete(k); return Promise.resolve();}
    return new Promise((res,rej)=>{const tx=this.db.transaction("kv","readwrite"); tx.objectStore("kv").delete(k);
      tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error);});
  }
};

const dirty=new Map(); let saveT=null; const cellKey=(id,k)=>"cell:"+id+"|"+k;
function setSave(state){
  const i=$("saveInd"); i.className=state==="busy"?"busy":state==="err"?"err":"";
  i.textContent=state==="busy"?"…":state==="err"?"⚠":"✓";
  i.title=state==="err"?"Sauvegarde impossible — exporte ta feuille !":store.mode==="mem"?"Mode temporaire : rien n'est conservé après fermeture":"Sauvegardé";
}
function markDirty(sh,keys){ // keys absent = feuille entière ; tableau = seulement ces cellules (+ infos de la feuille)
  let d=dirty.get(sh.id); if(!d){d={full:false,keys:new Set()};dirty.set(sh.id,d);}
  if(keys===undefined) d.full=true; else keys.forEach(k=>d.keys.add(k));
  setSave("busy"); clearTimeout(saveT); saveT=setTimeout(flush,3000);
}
async function flush(force){
  clearTimeout(saveT); if(!dirty.size) return;
  if(active&&force!==true){saveT=setTimeout(flush,800);return;}
  const batch=[...dirty.entries()]; dirty.clear();
  const t0=performance.now(); let nCells=0;
  try{
    const ops=[];
    for(const [id,d] of batch){
      const sh=sheets.find(x=>x.id===id); if(!sh) continue;
      const {cells,...meta}=sh; meta.fmt=2; ops.push(["put","sheet:"+id,meta]);
      if(d.full){
        const have=await store.keys(cellKey(id,""));
        for(const k of Object.keys(sh.cells)){ops.push(["put",cellKey(id,k),sh.cells[k]]);nCells++;}
        for(const fk of have){const k=fk.slice(cellKey(id,"").length); if(!sh.cells[k]) ops.push(["del",fk]);}
      }else{
        for(const k of d.keys){const c=sh.cells[k]; if(c){ops.push(["put",cellKey(id,k),c]);nCells++;} else ops.push(["del",cellKey(id,k)]);}
      }
    }
    await store.batch(ops);
    setSave(store.mode==="mem"?"err":"ok");
    dlogRaw("sauvegarde "+Math.round(performance.now()-t0)+" ms ("+nCells+" cellule(s))");
  }catch(e){
    console.error(e);
    batch.forEach(([id,d])=>{const x=dirty.get(id)||{full:false,keys:new Set()}; x.full=x.full||d.full; d.keys.forEach(k=>x.keys.add(k)); dirty.set(id,x);});
    setSave("err");
  }
}
function dropSheetData(id){
  store.keys(cellKey(id,"")).then(ks=>store.batch([["del","sheet:"+id],...ks.map(k=>["del",k])])).catch(()=>{});
}
function saveMeta(){
  store.put("meta",{v:5,ids:sheets.map(s=>s.id),S:{...S}}).catch(e=>{console.error(e); setSave("err");});
}

/* ═══════════════ dessin ═══════════════ */
const widthAt=(base,p)=>base*(0.8+0.7*Math.min(p,1));

function segPath(ctx,d,i,n){
  const x=d[3*i],y=d[3*i+1]; let sx,sy,ex,ey;
  if(i===0){sx=x;sy=y;}else{sx=(d[3*i-3]+x)/2;sy=(d[3*i-2]+y)/2;}
  if(i===n-1){ex=x;ey=y;}else{ex=(x+d[3*i+3])/2;ey=(y+d[3*i+4])/2;}
  ctx.beginPath();ctx.moveTo(sx,sy);ctx.quadraticCurveTo(x,y,ex,ey);ctx.stroke();
}
function drawStroke(ctx,st,color){
  const d=st.d,n=d.length/3; if(!n) return;
  ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineCap="round";ctx.lineJoin="round";
  if(n===1){ctx.beginPath();ctx.arc(d[0],d[1],widthAt(st.w,d[2])/2,0,6.2832);ctx.fill();return;}
  if(S.simple){ctx.lineWidth=st.w*1.1;ctx.beginPath();ctx.moveTo(d[0],d[1]);for(let i=1;i<n;i++)ctx.lineTo(d[3*i],d[3*i+1]);ctx.stroke();return;}
  for(let i=0;i<n;i++){ctx.lineWidth=widthAt(st.w,d[3*i+2]);segPath(ctx,d,i,n);}
}
const bgImgs=new WeakMap(); let bgRaf=0;
function getImg(cell){
  let im=bgImgs.get(cell);
  if(!im){im=new Image(); bgImgs.set(cell,im);
    im.onload=()=>{if(!bgRaf)bgRaf=requestAnimationFrame(()=>{bgRaf=0;redrawAll();});};
    im.src=cell.bg;}
  return im;
}
function paintCell(ctx,cell,w,h,o){
  if(o.guides){
    ctx.save();ctx.lineWidth=o.px;ctx.strokeStyle="#dfe4ec";
    ctx.beginPath();ctx.moveTo(10,h*.72);ctx.lineTo(w-10,h*.72);ctx.stroke();
    ctx.setLineDash([6*o.px,8*o.px]);ctx.strokeStyle="#e9edf3";
    ctx.beginPath();ctx.moveTo(10,h*.36);ctx.lineTo(w-10,h*.36);ctx.stroke();
    ctx.restore();
  }
  if(!cell) return;
  if(cell.bg){
    const im=getImg(cell);
    if(im.complete&&im.naturalWidth){ctx.save(); if(o.color) ctx.globalAlpha=.55; ctx.drawImage(im,0,0,cell.bgw||w,cell.bgh||h); ctx.restore();}
  }
  const ss=o.sel;
  for(const st of cell.s){
    if(ss&&ss.set.has(st)){ctx.save();ctx.translate(ss.dx,ss.dy);drawStroke(ctx,st,o.color||st.c);ctx.restore();}
    else drawStroke(ctx,st,o.color||st.c);
  }
}
const colLW=rec=>rec.cmp?Math.max(S.colW[rec.col],S.colW[rec.cmp]):S.colW[rec.col];

function redrawCell(rec){
  const cv=rec.el,ctx=rec.ctx,lw=colLW(rec);
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  const sx=cv.width/lw, sy=cv.height/S.rowH; ctx.setTransform(sx,0,0,sy,0,0);
  const px=1/sx;
  if(rec.cmp){
    paintCell(ctx,cur.cells[rec.key],lw,S.rowH,{guides:S.guides,px,color:COL_A});
    paintCell(ctx,cur.cells[ck(rec.cmp,rec.row)],lw,S.rowH,{guides:false,px,color:COL_B});
  }else{
    const sl=(sel&&sel.key===rec.key&&sel.sh===cur)?sel:null;
    paintCell(ctx,cur.cells[rec.key],lw,S.rowH,{guides:S.guides,px,sel:sl});
    if(sl) drawSelBox(ctx,sl);
    if(active&&active.kind==="lasso"&&active.rec===rec) drawLassoPath(ctx,active);
  }
  if(active&&active.kind==="stroke"&&active.rec===rec){
    const c=cur.cells[rec.key]; if(!c||!c.s.includes(active.st)) drawStroke(ctx,active.st,active.st.c);
  }
}
function layoutCell(rec){
  const w=colLW(rec)*Z,h=S.rowH*Z,dpr=Math.min(window.devicePixelRatio||1,3);
  const cw=Math.max(1,Math.round(w*dpr)),ch=Math.max(1,Math.round(h*dpr));
  if(rec.el.width!==cw||rec.el.height!==ch){rec.el.width=cw;rec.el.height=ch;}
  rec.wrap.style.width=w+"px";rec.wrap.style.height=h+"px";
  rec.el.style.width=w+"px";rec.el.style.height=h+"px";
  redrawCell(rec);
}
function redrawAll(){recs.forEach(redrawCell);}
function redrawKeys(keys){
  const set=keys instanceof Set?keys:new Set(keys);
  for(const r of recs){if(set.has(r.key)||(r.cmp&&set.has(ck(r.cmp,r.row)))) redrawCell(r);}
}
function applySizes(){
  dlogRaw("redessin complet");
  for(const h of hdrs) h.el.style.width=(h.w()*Z)+"px";
  for(const g of guts) g.el.style.height=(S.rowH*Z)+"px";
  for(const r of recs) layoutCell(r);
  $("zoomLbl").textContent=Math.round(Z*100)+"%";
}
function sizeColumn(col){
  for(const h of hdrs) if(h.cols.includes(col)) h.el.style.width=(h.w()*Z)+"px";
  for(const r of recs) if(r.col===col||r.cmp===col) layoutCell(r);
}

/* ═══════════════ zoom ═══════════════ */
function viewBands(v){
  if(v.bands) return v.bands.map(b=>b.map(c=>S.colW[c]));
  if(v.pair) return [v.pair.map(c=>S.colW[c])];
  return [[Math.max(S.colW[v.cmp[0]],S.colW[v.cmp[1]])]];
}
const getLock=()=>(cur&&cur.zlock)||S.zlockAll||0;
function fit(){
  const L=getLock();
  if(L){Z=clamp(L,.35,2.6); zoomMode="locked"; lastFitW=sc.clientWidth; applySizes(); return;}
  const avail=sc.clientWidth-2*PAD-GUT; let z=Infinity;
  for(const ws of viewBands(VIEWS[S.view])){
    const sum=ws.reduce((a,b)=>a+b,0); z=Math.min(z,(avail-ws.length*4)/sum);
  }
  Z=clamp(Math.floor(z*100)/100,.35,2.2); zoomMode="fit"; lastFitW=sc.clientWidth; applySizes();
}
function setZoom(z,ax,ay,force){
  if(!force&&getLock()){toast("🔒 Zoom verrouillé : touche 🔒 pour le changer");return;}
  const zo=Z; Z=clamp(Math.round(z*100)/100,.35,2.6); zoomMode="manual"; applySizes();
  if(ax==null){ax=sc.clientWidth/2;ay=sc.clientHeight/2;}
  const kx=PAD+GUT+4,ky=PAD+34;
  sc.scrollLeft=(sc.scrollLeft+ax-kx)*Z/zo+kx-ax;
  sc.scrollTop=(sc.scrollTop+ay-ky)*Z/zo+ky-ay;
}


/* ═══════════════ verrou de zoom ═══════════════ */
function setLockValue(z){
  z=Math.round(clamp(z,.35,2.6)*100)/100;
  if(cur.zlock){cur.zlock=z;markDirty(cur,[]);}
  else if(S.zlockAll){S.zlockAll=z;saveMeta();}
}
function openZoomLock(){
  const body=el("div"); body.style.display="contents";
  const L=getLock(),pct=Math.round(Z*100);
  const scope=cur.zlock?"cette feuille":"toutes les feuilles";
  body.append(el("p",null,L
    ?"🔒 Zoom verrouillé à "+Math.round(L*100)+" % pour "+scope+". Il ne bouge plus : pincement, − ＋ et ajustement automatique sont désactivés, même en changeant de vue ou de feuille."
    :"Zoom actuel : "+pct+" %. Une fois verrouillé, il ne bouge plus (pincement, − ＋ et ajustement automatique désactivés), même en changeant de vue ou de feuille."));
  const apply=p=>{
    p=+p; if(!(p>=35&&p<=260)){toast("Choisis entre 35 et 260 %");return;}
    const z=Math.round(p)/100;
    if(getLock()) setLockValue(z);
    setZoom(z,undefined,undefined,true);
    if(getLock()){zoomMode="locked";}
    refreshBar(); openZoomLock();
  };
  body.append(el("div","sec","Régler le pourcentage"));
  const g=el("div","btns");
  [80,90,100,110,117,130].forEach(p=>{const b=el("button",pct===p?"on":"",p+" %"); b.onclick=()=>apply(p); g.appendChild(b);});
  const inp=document.createElement("input"); inp.type="number"; inp.inputMode="numeric"; inp.min=35; inp.max=260; inp.value=pct;
  inp.style.cssText="width:90px;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:10px";
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();apply(inp.value);}});
  const ok=el("button",null,"Appliquer"); ok.onclick=()=>apply(inp.value);
  g.append(inp,ok); body.appendChild(g);
  body.append(el("div","sec","Verrouillage"));
  const g2=el("div","btns");
  const lk=(t,f,cls)=>{const b=el("button",cls||"",t); b.onclick=f; g2.appendChild(b);};
  const lockHere=all=>{
    const z=Math.round(Z*100)/100;
    if(all){S.zlockAll=z;delete cur.zlock;} else {cur.zlock=z;}
    markDirty(cur,[]); saveMeta(); zoomMode="locked"; closeModal(); refreshBar();
    toast("🔒 Zoom verrouillé à "+Math.round(z*100)+" % pour "+(all?"toutes les feuilles":"cette feuille"));
  };
  lk("🔒 Cette feuille",()=>lockHere(false),cur.zlock?"on":"");
  lk("🔒 Toutes les feuilles",()=>lockHere(true),(!cur.zlock&&S.zlockAll)?"on":"");
  if(L) lk("🔓 Déverrouiller",()=>{
    if(cur.zlock){delete cur.zlock;markDirty(cur,[]);} else {S.zlockAll=0;saveMeta();}
    closeModal(); if(getLock()){fit();} else zoomMode="manual";
    refreshBar(); toast("🔓 Zoom déverrouillé");
  },"bad");
  body.appendChild(g2);
  openModal("Zoom",body,[{t:"Fermer",cls:"on"}]);
}

/* ═══════════════ construction de la feuille ═══════════════ */
const rowVisible=r=>{const st=(cur.rows[r]&&cur.rows[r].st)|0; return S.filter===0||(S.filter===1&&st!==1)||(S.filter===2&&st===2);};
const isMasked=rec=>rec.answer&&answerHidden&&!revealed.has(rec.row);

function makeGut(r){
  const g=el("div","gut");
  const n=el("button","rn",String(r+1)); n.title="Ligne "+(r+1)+" : texte de référence, effacer la ligne";
  n.onclick=()=>openRowModal(r);
  const st=el("button","st");
  st.onclick=()=>{const ri=rowInfo(r); ri.st=((ri.st|0)+1)%3; markDirty(cur,[]); refreshGut(r); updateStats();};
  const sp=el("button","sp","🔊");
  sp.onclick=()=>{const t=(cur.rows[r]||{}).ref; if(t) speak(t); else openRowModal(r);};
  g.append(n,st,sp);
  const o={el:g,row:r,st,sp,rn:n}; guts.push(o); refreshGutOne(o); return g;
}
function refreshGutOne(o){
  const info=cur.rows[o.row]||{}, s=info.st|0;
  o.st.className="st"+(s?" s"+s:""); o.st.textContent=STG[s];
  o.sp.className="sp"+(info.ref?" has":"");
  const miss=rowHasInk(cur,o.row)&&!(info.ref&&info.fr);
  o.rn.className="rn"+(miss?" miss":"");
  o.rn.title=miss?"Ligne écrite : tape le thaï et le français":"Ligne "+(o.row+1)+" : texte thaï et français";
}
function refreshGut(r){guts.forEach(o=>{if(o.row===r)refreshGutOne(o);});}

function attachResize(hd,col){
  const h=el("div","rsz"); hd.appendChild(h);
  let sx=0,sw=0,drag=false;
  h.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();drag=true;sx=e.clientX;sw=S.colW[col];h.classList.add("drag");try{h.setPointerCapture(e.pointerId);}catch(_){}});
  h.addEventListener("pointermove",e=>{if(!drag)return;S.colW[col]=clamp(Math.round(sw+(e.clientX-sx)/Z),MINW,MAXW);sizeColumn(col);});
  const end=()=>{if(!drag)return;drag=false;h.classList.remove("drag");saveMeta();};
  h.addEventListener("pointerup",end);h.addEventListener("pointercancel",end);
}

function buildStage(){
  clearSel(false);
  stage.innerHTML=""; recs=[]; hdrs=[]; guts=[];
  const v=VIEWS[S.view];
  const bands=v.bands||[v.pair||[v.cmp[0]]];
  for(const cols of bands){
    const band=el("div","band");
    const hr=el("div","brow"); const sp=el("div","gut"); hr.appendChild(sp);
    for(const col of cols){
      const hd=el("div","chd"); const lab=el("span",null,LABELS[col]);
      if(v.cmp){lab.textContent=LABELS[v.cmp[0]]+" (bleu)  +  "+LABELS[v.cmp[1]]+" (rouge)";}
      if(v.pair&&col===v.pair[1]) lab.textContent=LABELS[col]+" — réponse";
      hd.appendChild(lab);
      const colsOf=v.cmp?v.cmp:[col];
      hdrs.push({el:hd,cols:colsOf,w:()=>v.cmp?Math.max(S.colW[v.cmp[0]],S.colW[v.cmp[1]]):S.colW[col]});
      if(!v.cmp) attachResize(hd,col);
      hr.appendChild(hd);
    }
    band.appendChild(hr);
    for(let r=0;r<cur.nRows;r++){
      if(!rowVisible(r)) continue;
      const row=el("div","brow"); row.appendChild(makeGut(r));
      for(const col of cols){
        const wrap=el("div","cell"); const cv=document.createElement("canvas"); cv.className="cv"; wrap.appendChild(cv);
        ["touchstart","touchmove"].forEach(t=>cv.addEventListener(t,ev=>{if(ev.cancelable)ev.preventDefault();},{passive:false}));
        const rec={el:cv,wrap,ctx:cv.getContext("2d"),col,row:r,key:ck(col,r),cmp:v.cmp?v.cmp[1]:null,answer:!!(v.pair&&col===v.pair[1]),mask:null};
        if(rec.answer){
          const m=el("div","mask","👁 Touche pour révéler"); m.onclick=()=>revealRow(r); wrap.appendChild(m); rec.mask=m;
        }
        recMap.set(cv,rec); recs.push(rec); row.appendChild(wrap);
      }
      band.appendChild(row);
    }
    stage.appendChild(band);
  }
  const add=el("button","addrow","＋ 5 lignes"); add.onclick=()=>addRows(5); stage.appendChild(add);
  updateMasks();
}
function rebuild(refit){
  const x=sc.scrollLeft,y=sc.scrollTop;
  buildStage();
  if(refit) fit(); else applySizes();
  if(!refit){sc.scrollLeft=x;sc.scrollTop=y;}
  refreshBar();
}
function updateMasks(){
  for(const r of recs) if(r.mask) r.mask.style.display=isMasked(r)?"flex":"none";
}
function revealRow(r){revealed.add(r);updateMasks();}

/* ═══════════════ annuler / rétablir ═══════════════ */
function pushOp(op){
  undoStack.push(op); if(undoStack.length>300) undoStack.shift(); redoStack=[];
  markDirty(op.sh,op.keys); refreshBar();
}
function undo(){const op=undoStack.pop(); if(!op)return; clearSel(false); op.undo(); redoStack.push(op); markDirty(op.sh,op.keys); refreshBar();}
function redo(){const op=redoStack.pop(); if(!op)return; clearSel(false); op.redo(); undoStack.push(op); markDirty(op.sh,op.keys); refreshBar();}
function sortCell(c){c.s.sort((a,b)=>(a.i||0)-(b.i||0));}

function clearCellOp(key){
  const sh=cur,c=sh.cells[key]; if(!c){return;}
  clearSel(false);
  delete sh.cells[key]; redrawKeys([key]);
  pushOp({sh,keys:[key],undo(){sh.cells[key]=c;redrawKeys([key]);},redo(){delete sh.cells[key];redrawKeys([key]);}});
}
function clearRow(r){
  const sh=cur,snap={}; clearSel(false);
  for(let col=1;col<=8;col++){const k=ck(col,r); if(sh.cells[k]){snap[k]=sh.cells[k];delete sh.cells[k];}}
  const keys=Object.keys(snap); if(!keys.length){toast("Ligne déjà vide");return;}
  redrawKeys(keys);
  pushOp({sh,keys,undo(){keys.forEach(k=>sh.cells[k]=snap[k]);redrawKeys(keys);},redo(){keys.forEach(k=>delete sh.cells[k]);redrawKeys(keys);}});
}
function clearSheet(){
  const sh=cur,snap=sh.cells; if(!Object.keys(snap).length){toast("Feuille déjà vide");return;}
  clearSel(false);
  sh.cells={}; redrawAll();
  pushOp({sh,undo(){sh.cells=snap;redrawAll();},redo(){sh.cells={};redrawAll();}});
}

/* ═══════════════ gestes : stylet, gomme, doigts ═══════════════ */
let active=null;               // geste de dessin/gomme en cours
const touches=new Map();       // doigts (défilement / pincement)
let pan=null,pinch=null,inertiaRaf=0;

function stopInertia(){if(inertiaRaf){cancelAnimationFrame(inertiaRaf);inertiaRaf=0;}}
function inertia(vx,vy){
  let last=performance.now();
  const step=now=>{
    const dt=now-last; last=now;
    sc.scrollLeft-=vx*dt; sc.scrollTop-=vy*dt;
    const f=Math.pow(.94,dt/16); vx*=f; vy*=f;
    inertiaRaf=(Math.abs(vx)>.02||Math.abs(vy)>.02)?requestAnimationFrame(step):0;
  };
  inertiaRaf=requestAnimationFrame(step);
}
function cancelPinch(){if(pinch){stage.style.transform="";stage.style.transformOrigin="0 0";pinch=null;}}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function startTouch(e){
  touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(touches.size===1){pan={lx:e.clientX,ly:e.clientY,vx:0,vy:0,lt:e.timeStamp};}
  else if(touches.size===2){
    if(getLock()){touches.delete(e.pointerId);return;}   // zoom verrouillé : le 2e doigt est ignoré
    pan=null; const [a,b]=[...touches.values()]; const r=stage.getBoundingClientRect();
    const cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
    pinch={d0:dist(a,b)||1,z0:Z,cx,cy,scale:1};
    stage.style.transformOrigin=(cx-r.left)+"px "+(cy-r.top)+"px";
  }
}
function touchMove(e){
  const t=touches.get(e.pointerId); if(!t) return; t.x=e.clientX; t.y=e.clientY;
  if(pinch&&touches.size>=2){
    const [a,b]=[...touches.values()];
    pinch.scale=clamp(dist(a,b)/pinch.d0,.35/pinch.z0,2.6/pinch.z0);
    stage.style.transform="scale("+pinch.scale+")";
  }else if(pan&&touches.size===1){
    const dx=e.clientX-pan.lx,dy=e.clientY-pan.ly,dt=Math.max(1,e.timeStamp-pan.lt);
    sc.scrollLeft-=dx; sc.scrollTop-=dy;
    pan.vx=pan.vx*.6+(dx/dt)*.4; pan.vy=pan.vy*.6+(dy/dt)*.4;
    pan.lx=e.clientX; pan.ly=e.clientY; pan.lt=e.timeStamp;
  }
}
function endTouch(e){
  if(!touches.has(e.pointerId)) return;
  touches.delete(e.pointerId);
  if(pinch){
    const p=pinch; cancelPinch(); // retire la prévisualisation, puis applique le vrai zoom
    const r=sc.getBoundingClientRect();
    setZoom(p.z0*p.scale,p.cx-r.left,p.cy-r.top); refreshBar();
    if(touches.size===1){const t=[...touches.values()][0]; pan={lx:t.x,ly:t.y,vx:0,vy:0,lt:performance.now()};}
    return;
  }
  if(pan&&touches.size===0){
    if(Math.abs(pan.vx)>.05||Math.abs(pan.vy)>.05) inertia(pan.vx,pan.vy);
    pan=null;
  }
}

function onDown(e){
  const cv=e.target.closest&&e.target.closest("canvas.cv"); if(!cv) return;
  stopInertia();
  const rec=recMap.get(cv); if(!rec) return;
  dlog(e,"down");
  if(e.pointerType==="touch"&&(active||S.fingerMode!=="draw")){ if(!active) startTouch(e); return; }
  if(active) endActive();   // trait précédent resté « ouvert » : on le termine puis on enchaîne
  if(e.pointerType==="mouse"&&e.button!==0) return;
  e.preventDefault();
  if(rec.cmp){toast("Vue de comparaison : lecture seule");return;}
  if(isMasked(rec)){revealRow(rec.row);return;}
  touches.clear(); pan=null; cancelPinch();
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(S.tool==="cell"){clearCellOp(rec.key);return;}
  if(S.tool==="erase"){active={kind:"erase",id:e.pointerId,removed:[],touched:new Set()};eraseAt(e);return;}
  if(S.tool==="lasso"||S.tool==="rect"){startSel(e,cv,rec);return;}
  beginStroke(e,cv,rec);
}
function onMove(e){
  if(e.pointerType==="touch"&&touches.has(e.pointerId)){touchMove(e);return;}
  if(active&&e.pointerId===active.id){
    if(e.pointerType!=="touch"&&e.buttons===0&&e.pressure===0){dlog(e,"fin(survol)");endActive();return;}
    e.preventDefault();
    if(active.kind==="stroke") strokeMove(e); else if(active.kind==="erase") eraseAt(e); else if(active.kind==="lasso") lassoMove(e); else moveSel(e);
  }
}
function endActive(){
  if(!active) return;
  const a=active, t0=performance.now();
  try{ if(a.kind==="stroke") finishStroke(); else if(a.kind==="erase") finishErase(); else finishSel(a); }
  catch(err){console.error("fin de trait",err);}
  finally{active=null; const dt=performance.now()-t0; if(dt>30) dlogRaw("fin de trait "+Math.round(dt)+" ms");}
}
function onUp(e){
  if(active&&e.pointerId===active.id){dlog(e,"up");endActive();return;}
  if(touches.has(e.pointerId)) endTouch(e);
}
// filets de sécurité : la fin du geste est captée même si l'événement n'arrive pas sur la feuille
const safeEnd=e=>{if(active&&e.pointerId===active.id){dlog(e,e.type);endActive();}};
window.addEventListener("pointerup",safeEnd,true);
window.addEventListener("pointercancel",safeEnd,true);
sc.addEventListener("lostpointercapture",safeEnd);
sc.addEventListener("pointerdown",onDown,{passive:false});
sc.addEventListener("pointermove",onMove,{passive:false});
sc.addEventListener("pointerup",onUp);
sc.addEventListener("pointercancel",onUp);

/* ---- trait ---- */
function beginStroke(e,cv,rec){
  const lw=colLW(rec),ctx=rec.ctx;
  ctx.setTransform(cv.width/lw,0,0,cv.height/S.rowH,0,0);
  active={kind:"stroke",id:e.pointerId,rec,lw,r:cv.getBoundingClientRect(),pp:.5,t0:performance.now(),ne:0,
    st:{c:S.color,w:S.width,d:[],i:nextId()}};
  addPt(active,e);
}
function strokeMove(e){
  const evs=(e.getCoalescedEvents&&!S.simple)?e.getCoalescedEvents():[];
  for(const ev of (evs.length?evs:[e])) addPt(active,ev);
}
function addPt(a,ev){
  const {rec,r,lw,st}=a,d=st.d,n=d.length/3;
  const x=r1((ev.clientX-r.left)*lw/r.width), y=r1((ev.clientY-r.top)*S.rowH/r.height);
  let p=(!S.simple&&ev.pointerType==="pen"&&ev.pressure>0)?ev.pressure:.5;
  if(n){
    const dx=x-d[3*n-3],dy=y-d[3*n-2]; if(dx*dx+dy*dy<.12) return;
    p=a.pp*.55+p*.45;
  }
  a.pp=p; a.ne++; a.pmin=a.pmin===undefined?p:Math.min(a.pmin,p); a.pmax=a.pmax===undefined?p:Math.max(a.pmax,p);
  d.push(x,y,Math.round(p*100)/100);
  const m=d.length/3,ctx=rec.ctx;
  ctx.strokeStyle=st.c;ctx.fillStyle=st.c;ctx.lineCap="round";ctx.lineJoin="round";
  if(m===1){ctx.beginPath();ctx.arc(x,y,widthAt(st.w,d[2])/2,0,6.2832);ctx.fill();}
  else if(S.simple){ctx.lineWidth=st.w*1.1;ctx.beginPath();ctx.moveTo(d[3*m-6],d[3*m-5]);ctx.lineTo(x,y);ctx.stroke();}
  else{ctx.lineWidth=widthAt(st.w,d[3*(m-2)+2]);segPath(ctx,d,m-2,m);}
}
function inkNear(rec,d,n,lw){
  try{
    const cv=rec.el,sx=cv.width/lw,sy=cv.height/S.rowH,mi=Math.floor(n/2),w=6;
    const x0=clamp(Math.round(d[3*mi]*sx)-w,0,cv.width-1),y0=clamp(Math.round(d[3*mi+1]*sy)-w,0,cv.height-1);
    const im=rec.ctx.getImageData(x0,y0,Math.max(1,Math.min(2*w,cv.width-x0)),Math.max(1,Math.min(2*w,cv.height-y0))).data;
    for(let i=0;i<im.length;i+=4) if(im[i+3]>200&&Math.min(im[i],im[i+1],im[i+2])<130) return "oui";
    return "NON";
  }catch(e){return "?";}
}
function finishStroke(){
  const a=active,st=a.st,d=st.d,n=d.length/3,rec=a.rec;
  if(!n) return;
  dlogRaw("trait "+n+" pts, "+Math.round(performance.now()-a.t0)+" ms, pression "+(a.pmin||0).toFixed(2)+"–"+(a.pmax||0).toFixed(2));
  if(n>1&&!S.simple){const ctx=rec.ctx;ctx.strokeStyle=st.c;ctx.lineCap="round";ctx.lineWidth=widthAt(st.w,d[3*n-1]);segPath(ctx,d,n-1,n);}
  const sh=cur,key=rec.key;
  cellOf(sh,key,true).s.push(st);
  const inkLive=diag?inkNear(rec,d,n,a.lw):"";
  redrawCell(rec);
  if(diag) dlogRaw("encre dans la case : tracé direct "+inkLive+" / après redessin "+inkNear(rec,d,n,a.lw));
  pushOp({sh,keys:[key],
    undo(){const c=sh.cells[key]; if(c){const i=c.s.indexOf(st); if(i>=0)c.s.splice(i,1); pruneCell(sh,key);} redrawKeys([key]);},
    redo(){const c=cellOf(sh,key,true); if(!c.s.includes(st)){c.s.push(st);sortCell(c);} redrawKeys([key]);}});
  maybeGrow(rec,d[0],d[1],d[3*n-3],d[3*n-2]);
}
function maybeGrow(rec,sx,sy,ex,ey){
  if(!S.autoGrow||rec.cmp) return;
  const w=S.colW[rec.col]; if(w>=MAXGROW) return;
  if(ex<w*.95) return;
  if(Math.hypot(ex-sx,ey-sy)<20) return;
  const oldRight=rec.wrap.getBoundingClientRect().right;
  S.colW[rec.col]=Math.min(MAXGROW,w+80); sizeColumn(rec.col); saveMeta();
  const hd=hdrs.find(h=>h.cols.includes(rec.col)); if(hd){hd.el.classList.add("flash");setTimeout(()=>hd.el.classList.remove("flash"),500);}
  const sr=sc.getBoundingClientRect();
  if(oldRight>sr.left+sr.width*.7) sc.scrollTo({left:sc.scrollLeft+(oldRight-(sr.left+sr.width*.55)),behavior:"smooth"});
}


/* ---- lasso (forme libre) et cadre (rectangle) : sélectionner des traits dans une case puis les déplacer ---- */
function ptInPoly(x,y,P){
  let inside=false; const n=P.length/2;
  for(let i=0,j=n-1;i<n;j=i++){
    const xi=P[2*i],yi=P[2*i+1],xj=P[2*j],yj=P[2*j+1];
    if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function strokesBox(list){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const st of list){const d=st.d,h=st.w/2+1;
    for(let i=0;i<d.length;i+=3){x0=Math.min(x0,d[i]-h);x1=Math.max(x1,d[i]+h);y0=Math.min(y0,d[i+1]-h);y1=Math.max(y1,d[i+1]+h);}}
  return {x0,y0,x1,y1};
}
function clearSel(redraw){
  if(!sel) return;
  const key=sel.key; sel=null;
  $("selbar").classList.remove("on"); document.body.classList.remove("hasSel");
  if(redraw!==false) redrawKeys([key]);
}
function drawSelBox(ctx,s){
  const b=s.box,P=6,u=1/Z;
  ctx.save(); ctx.fillStyle="rgba(10,99,255,.08)";
  ctx.fillRect(b.x0+s.dx-P,b.y0+s.dy-P,b.x1-b.x0+2*P,b.y1-b.y0+2*P);
  ctx.lineWidth=2*u; ctx.strokeStyle="#0a63ff"; ctx.setLineDash([6*u,4*u]);
  ctx.strokeRect(b.x0+s.dx-P,b.y0+s.dy-P,b.x1-b.x0+2*P,b.y1-b.y0+2*P);
  ctx.restore();
}
function drawLassoPath(ctx,a){
  const u=1/Z,p=a.pts; ctx.save();
  ctx.lineWidth=2*u; ctx.strokeStyle="#0a63ff"; ctx.setLineDash([6*u,4*u]); ctx.lineJoin="round"; ctx.lineCap="round";
  ctx.beginPath();
  if(a.rect){ if(p.length>=4) ctx.rect(Math.min(p[0],p[2]),Math.min(p[1],p[3]),Math.abs(p[2]-p[0]),Math.abs(p[3]-p[1])); }
  else{ ctx.moveTo(p[0],p[1]); for(let i=2;i<p.length;i+=2) ctx.lineTo(p[i],p[i+1]); }
  ctx.stroke();
  if(!a.rect&&p.length>=6){ctx.globalAlpha=.35;ctx.beginPath();ctx.moveTo(p[p.length-2],p[p.length-1]);ctx.lineTo(p[0],p[1]);ctx.stroke();}
  ctx.restore();
}
function schedRedraw(a){
  if(a.raf) return;
  a.raf=requestAnimationFrame(()=>{a.raf=0; redrawCell(a.rec);});
}
function startSel(e,cv,rec){
  const lw=colLW(rec),r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)*lw/r.width, y=(e.clientY-r.top)*S.rowH/r.height;
  if(sel&&sel.key===rec.key&&sel.sh===cur){
    const b=sel.box,P=12;
    if(x>=b.x0-P&&x<=b.x1+P&&y>=b.y0-P&&y<=b.y1+P){
      active={kind:"move",id:e.pointerId,rec,sx:e.clientX,sy:e.clientY,raf:0};
      return;
    }
  }
  clearSel();
  active={kind:"lasso",id:e.pointerId,rec,lw,r,rect:S.tool==="rect",pts:[x,y],raf:0};
}
function lassoMove(e){
  const a=active,evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];
  for(const ev of (evs.length?evs:[e])){
    const x=clamp((ev.clientX-a.r.left)*a.lw/a.r.width,0,a.lw), y=clamp((ev.clientY-a.r.top)*S.rowH/a.r.height,0,S.rowH);
    if(a.rect){a.pts[2]=x;a.pts[3]=y;}
    else{const n=a.pts.length; if(Math.hypot(x-a.pts[n-2],y-a.pts[n-1])>=2) a.pts.push(x,y);}
  }
  schedRedraw(a);
}
function moveSel(e){
  const a=active; if(!sel) return;
  const b=sel.box,col=a.rec.col;
  let dx=(e.clientX-a.sx)/Z, dy=(e.clientY-a.sy)/Z;
  const lo=1-b.y0,hi=S.rowH-1-b.y1; dy=lo>hi?0:clamp(dy,lo,hi);
  const need=b.x1+dx+6;                       // la colonne s'élargit si on pousse la sélection vers la droite
  if(need>S.colW[col]&&S.autoGrow&&S.colW[col]<MAXGROW){
    sel.dx=dx; sel.dy=dy;
    S.colW[col]=Math.min(MAXGROW,Math.ceil((need+40)/10)*10); sizeColumn(col); a.grew=true;
  }
  dx=Math.min(dx,S.colW[col]-6-b.x1); dx=Math.max(dx,2-b.x0);
  sel.dx=dx; sel.dy=dy; schedRedraw(a);
}
function shiftStrokes(list,dx,dy){
  for(const st of list){const d=st.d; for(let i=0;i<d.length;i+=3){d[i]=r1(d[i]+dx);d[i+1]=r1(d[i+1]+dy);}}
}
function finishSel(a){
  active=null;
  if(a.raf){cancelAnimationFrame(a.raf);a.raf=0;}
  if(a.kind==="move"){
    if(!sel){return;}
    const dx=r1(sel.dx),dy=r1(sel.dy),key=sel.key,list=sel.list,sh=cur;
    if(a.grew) saveMeta();
    if(Math.abs(dx)<.5&&Math.abs(dy)<.5){sel.dx=sel.dy=0; redrawKeys([key]); return;}
    shiftStrokes(list,dx,dy);
    sel.box={x0:sel.box.x0+dx,y0:sel.box.y0+dy,x1:sel.box.x1+dx,y1:sel.box.y1+dy}; sel.dx=sel.dy=0;
    redrawKeys([key]);
    pushOp({sh,keys:[key],
      undo(){shiftStrokes(list,-dx,-dy);redrawKeys([key]);},
      redo(){shiftStrokes(list,dx,dy);redrawKeys([key]);}});
    return;
  }
  // fin du tracé du lasso : quels traits sont dedans ?
  const rec=a.rec,p=a.pts; let poly=null;
  if(a.rect){ if(p.length>=4&&Math.abs(p[2]-p[0])>=4&&Math.abs(p[3]-p[1])>=4) poly=[p[0],p[1],p[2],p[1],p[2],p[3],p[0],p[3]]; }
  else if(p.length>=8) poly=p;
  if(!poly){redrawCell(rec);return;}                       // simple toucher : rien à sélectionner
  const cell=cur.cells[rec.key],list=[];
  if(cell) for(const st of cell.s){
    const d=st.d,n=d.length/3; let inn=0;
    for(let i=0;i<n;i++) if(ptInPoly(d[3*i],d[3*i+1],poly)) inn++;
    if(n&&inn/n>=.5) list.push(st);
  }
  if(!list.length){redrawCell(rec);toast("Rien dans la sélection : entoure les traits");return;}
  sel={sh:cur,key:rec.key,col:rec.col,row:rec.row,list,set:new Set(list),box:strokesBox(list),dx:0,dy:0};
  $("selbar").classList.add("on"); document.body.classList.add("hasSel");
  redrawCell(rec);
}
function delSel(){
  if(!sel) return;
  const sh=cur,key=sel.key,list=sel.list.slice(),c=sh.cells[key]; if(!c){clearSel();return;}
  clearSel(false);
  list.forEach(st=>{const i=c.s.indexOf(st); if(i>=0)c.s.splice(i,1);}); pruneCell(sh,key); redrawKeys([key]);
  pushOp({sh,keys:[key],
    undo(){const cc=cellOf(sh,key,true); list.forEach(st=>{if(!cc.s.includes(st))cc.s.push(st);}); sortCell(cc); redrawKeys([key]);},
    redo(){const cc=sh.cells[key]; if(cc){list.forEach(st=>{const i=cc.s.indexOf(st); if(i>=0)cc.s.splice(i,1);}); pruneCell(sh,key);} redrawKeys([key]);}});
}
$("sbDel").onclick=delSel;
$("sbOk").onclick=()=>clearSel();

/* ---- gomme (au trait entier) ---- */
function distSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;
  let t=l?((px-ax)*dx+(py-ay)*dy)/l:0; t=clamp(t,0,1);
  return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
}
function hitStroke(st,x,y,rad){
  const d=st.d,n=d.length/3,rr=rad+widthAt(st.w,.5)/2;
  if(n===1) return Math.hypot(d[0]-x,d[1]-y)<=rr;
  for(let i=0;i<n-1;i++) if(distSeg(x,y,d[3*i],d[3*i+1],d[3*i+3],d[3*i+4])<=rr) return true;
  return false;
}
function eraseAt(e){
  const a=active,evs=e.getCoalescedEvents?e.getCoalescedEvents():[];
  for(const ev of (evs.length?evs:[e])){
    const t=document.elementFromPoint(ev.clientX,ev.clientY);
    const cv=t&&t.closest?t.closest("canvas.cv"):null; if(!cv) continue;
    const rec=recMap.get(cv); if(!rec||rec.cmp||isMasked(rec)) continue;
    const cell=cur.cells[rec.key]; if(!cell||!cell.s.length) continue;
    const r=cv.getBoundingClientRect(),k=colLW(rec)/r.width;
    const x=(ev.clientX-r.left)*k,y=(ev.clientY-r.top)*S.rowH/r.height,rad=14*k;
    for(let i=cell.s.length-1;i>=0;i--){
      if(hitStroke(cell.s[i],x,y,rad)){a.removed.push({key:rec.key,st:cell.s[i]});cell.s.splice(i,1);a.touched.add(rec.key);}
    }
  }
  if(a.touched.size){redrawKeys(a.touched);a.touched=new Set();}
}
function finishErase(){
  const rem=active.removed; if(!rem.length) return;
  const sh=cur,keys=[...new Set(rem.map(x=>x.key))];
  keys.forEach(k=>pruneCell(sh,k));
  pushOp({sh,keys,
    undo(){rem.forEach(({key,st})=>cellOf(sh,key,true).s.push(st)); keys.forEach(k=>{const c=sh.cells[k]; if(c)sortCell(c);}); redrawKeys(keys);},
    redo(){rem.forEach(({key,st})=>{const c=sh.cells[key]; if(c){const i=c.s.indexOf(st); if(i>=0)c.s.splice(i,1); pruneCell(sh,key);}}); redrawKeys(keys);}});
}

let warnedVoice=false;
function speak(text){
  if(!("speechSynthesis" in window)){toast("Synthèse vocale indisponible");return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang="th-TH"; u.rate=.85;
  const v=speechSynthesis.getVoices().find(x=>/^th/i.test(x.lang));
  if(v) u.voice=v;
  else if(!warnedVoice){warnedVoice=true;toast("Voix thaïe absente : Réglages › Accessibilité › Contenu énoncé › Voix",4200);}
  speechSynthesis.speak(u);
}

function buildCards(){
  const out=[];let total=0,ko=0;
  sheets.forEach(sh=>{
    const lines=[];
    for(let r=0;r<sh.nRows;r++){
      const i=sh.rows[r];
      if(i&&i.ref&&i.fr){lines.push({n:r+1,thai:i.ref,fr:i.fr,st:i.st|0});if((i.st|0)===2)ko++;}
    }
    if(lines.length){out.push({id:sh.id,name:sh.name,lines});total+=lines.length;}
  });
  return {total,ko,data:{app:"fiche-thai-cartes",v:1,exported:new Date().toISOString(),sheets:out}};
}
function sendToRevision(){
  const c=buildCards();
  if(!c.total){toast("Aucune ligne n'a encore son thaï et son français tapés",4200);return;}
  saveFile(new Blob([JSON.stringify(c.data)],{type:"application/json"}),"cartes-thai-"+today()+".json").then(ok=>{
    if(ok)toast(c.total+" carte(s) prête(s), dont "+c.ko+" marquée(s) ✗",4000);});
}

async function saveFile(blob,name){
  try{
    const f=new File([blob],name,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true;}
  }catch(e){if(e&&e.name==="AbortError")return false;}
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000); return true;
}
const today=()=>new Date().toISOString().slice(0,10);
function exportJSON(){
  const data={app:"fiche-thai",v:5,exported:new Date().toISOString(),settings:{colW:S.colW,rowH:S.rowH,log:S.log,goal:S.goal},sheets};
  saveFile(new Blob([JSON.stringify(data)],{type:"application/json"}),"fiche-thai-"+today()+".json").then(ok=>{
    if(ok){S.lastExport=Date.now();saveMeta();refreshBar();toast("Sauvegarde exportée");}
  });
}
function exportPNG(){
  const pad=20,gutW=64,hdH=26,gap=4,titleH=34,bandGap=18,rows=cur.nRows,rh=S.rowH;
  const bw=b=>gutW+b.length*gap+b.reduce((a,c)=>a+S.colW[c],0);
  const W=pad*2+Math.max(...BANDS.map(bw));
  const bandH=hdH+gap+rows*(rh+gap);
  const H=pad*2+titleH+BANDS.length*bandH+(BANDS.length-1)*bandGap;
  const k=Math.min(2,Math.sqrt(14e6/(W*H)));
  const cv=document.createElement("canvas"); cv.width=Math.round(W*k); cv.height=Math.round(H*k);
  const ctx=cv.getContext("2d"); ctx.scale(k,k); ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#111"; ctx.font="600 16px -apple-system,Helvetica,sans-serif"; ctx.textBaseline="middle";
  ctx.fillText(cur.name+" — "+new Date().toLocaleDateString("fr-FR"),pad,pad+16);
  let y=pad+titleH;
  for(const b of BANDS){
    let x=pad+gutW+gap;
    for(const col of b){
      const w=S.colW[col]; ctx.fillStyle="#2c3e50"; ctx.fillRect(x,y,w,hdH);
      ctx.fillStyle="#fff"; ctx.font="600 12px -apple-system,Helvetica,sans-serif"; ctx.textAlign="center"; ctx.fillText(LABELS[col],x+w/2,y+hdH/2); x+=w+gap;
    }
    ctx.textAlign="left";
    for(let r=0;r<rows;r++){
      const yy=y+hdH+gap+r*(rh+gap),s=(cur.rows[r]&&cur.rows[r].st)|0;
      ctx.fillStyle=s===1?"#1f9d55":s===2?"#d93025":"#6e6e73"; ctx.font="600 13px -apple-system,Helvetica,sans-serif";
      ctx.fillText((r+1)+"  "+(s?STG[s]:""),pad+6,yy+rh/2);
      x=pad+gutW+gap;
      for(const col of b){
        const w=S.colW[col];
        ctx.fillStyle="#fff"; ctx.fillRect(x,yy,w,rh); ctx.strokeStyle="#d8d8de"; ctx.lineWidth=1; ctx.strokeRect(x+.5,yy+.5,w-1,rh-1);
        ctx.save(); ctx.beginPath(); ctx.rect(x,yy,w,rh); ctx.clip(); ctx.translate(x,yy);
        paintCell(ctx,cur.cells[ck(col,r)],w,rh,{guides:S.guides,px:1/k}); ctx.restore();
        x+=w+gap;
      }
    }
    y+=bandH+bandGap;
  }
  cv.toBlob(bl=>{
    if(!bl){toast("Export image impossible");return;}
    saveFile(bl,"fiche-thai-"+cur.name.replace(/[^\w\-]+/g,"_")+"-"+today()+".png");
  },"image/png");
}

function legacySheets(o,widths){
  const out=[];
  o.sheets.forEach((s,i)=>{
    const data=s.data||{},keys=Object.keys(data); if(!keys.length) return;
    const sh=newSheet("Ancienne feuille "+(i+1));
    for(const k of keys){
      const m=/^(\d+)_row(\d+)$/.exec(k); if(!m||!data[k]) continue;
      const col=+m[1],row=+m[2];
      sh.cells[col+"_"+row]={s:[],bg:data[k],bgw:(widths&&widths[col])||DEF_COLW[col]||340,bgh:65};
    }
    out.push(sh);
  });
  return out;
}
function normSheet(s){
  return {id:uid(),name:String(s.name||"Feuille"),nRows:clamp(s.nRows|0||10,1,60),cells:s.cells||{},rows:s.rows||{},rev:(s.rev&&typeof s.rev==="object")?s.rev:null,t:Date.now()};
}
function parseBackup(txt){
  const o=JSON.parse(txt);
  if(o&&o.app==="fiche-thai"&&Array.isArray(o.sheets)) return {sheets:o.sheets.map(normSheet),settings:o.settings,legacy:false};
  if(o&&Array.isArray(o.sheets)&&o.sheets.every(s=>s&&typeof s==="object"&&s.data)) return {sheets:legacySheets(o),legacy:true};
  throw new Error("Format non reconnu");
}

/* ═══════════════ révisions espacées (type Anki) ═══════════════ */
const pad2=n=>String(n).padStart(2,"0");
function dstr(d){d=d||new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function parseD(ds){const p=ds.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);}
function addDays(ds,n){const d=parseD(ds);d.setDate(d.getDate()+n);return dstr(d);}
function daysBetween(a,b){const x=parseD(a),y=parseD(b);return Math.round((Date.UTC(y.getFullYear(),y.getMonth(),y.getDate())-Date.UTC(x.getFullYear(),x.getMonth(),x.getDate()))/864e5);}
function fmtD(ds){return parseD(ds).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});}
function inDays(ds){const n=daysBetween(dstr(),ds);return n<0?"en retard de "+(-n)+" j":n===0?"aujourd'hui":n===1?"demain":"dans "+n+" j";}
function countLines(sh){const rows=new Set();for(const k in sh.cells){const c=sh.cells[k];if(c&&((c.s&&c.s.length)||c.bg))rows.add(k.split("_")[1]);}return rows.size;}
function countKo(sh){let n=0;for(let r=0;r<sh.nRows;r++){if(sh.rows[r]&&(sh.rows[r].st|0)===2)n++;}return n;}
function isDue(sh){const r=sh.rev;return !!(r&&r.on&&r.due<=dstr());}
function logAdd(f,n){
  const t=dstr();if(!S.log||typeof S.log!=="object")S.log={};
  const L=S.log[t]||(S.log[t]={n:0,r:0,s:0});L[f]=(L[f]||0)+n;
  const ks=Object.keys(S.log).sort();while(ks.length>70)delete S.log[ks.shift()];
}
function scheduleSheet(sh,due){
  const t=dstr(),ivl=Math.max(1,daysBetween(t,due));
  if(sh.rev&&sh.rev.on){sh.rev.due=due;sh.rev.ivl=ivl;}
  else{sh.rev={on:true,due:due,ivl:ivl,ease:2.5,reps:0,lapses:0,fin:t,last:null};logAdd("n",countLines(sh));logAdd("s",1);}
  markDirty(sh,[]);saveMeta();refreshBar();
}
function nextIvl(r,g){
  const ivl=Math.max(1,r.ivl||1),e=r.ease||2.5;
  if(g===0)return 1;
  if(g===1)return Math.max(ivl+1,Math.round(ivl*1.2));
  if(g===2)return Math.max(ivl+1,Math.round(ivl*e));
  return Math.max(ivl+2,Math.round(ivl*e*1.3));
}
function gradeSheet(sh,g){
  const r=sh.rev,t=dstr(),ivl=nextIvl(r,g);
  r.ease=clamp((r.ease||2.5)+[-.2,-.15,0,.15][g],1.3,3);
  if(g===0)r.lapses=(r.lapses||0)+1;
  r.reps=(r.reps||0)+1;r.ivl=ivl;r.due=addDays(t,ivl);r.last=t;
  logAdd("r",countLines(sh));logAdd("s",1);
  markDirty(sh,[]);saveMeta();refreshBar();
  return r.due;
}
function refreshRev(){
  const nd=sheets.filter(isDue).length,r=cur.rev,b=$("bFinish"),rb=$("bRev");
  rb.textContent="📅 Révisions"+(nd?" · "+nd:"");rb.classList.toggle("on",nd>0);
  if(r&&r.on){
    if(r.due<=dstr()){b.textContent="🔔 À revoir";b.classList.add("on");}
    else{b.textContent="✅ Revue "+fmtD(r.due);b.classList.remove("on");}
  }else{b.textContent="✅ Terminer";b.classList.remove("on");}
  fillSheetSelect();
}
function rowHasInk(sh,r){for(let c=1;c<=8;c++){const x=sh.cells[ck(c,r)];if(x&&((x.s&&x.s.length)||x.bg))return true;}return false;}
function missingRows(sh){const o=[];for(let r=0;r<sh.nRows;r++){const i=sh.rows[r];if(rowHasInk(sh,r)&&!(i&&i.ref&&i.fr))o.push(r);}return o;}
function openFinish(sh){
  const r=sh.rev;
  if(r&&r.on&&r.due<=dstr()){openGrade(sh);return;}
  const on=!!(r&&r.on),body=el("div");body.style.display="contents";
  if(on){
    body.append(el("p",null,"Prochaine révision : "+fmtD(r.due)+" ("+inDays(r.due)+")."),
      el("p",null,"Terminée le "+fmtD(r.fin)+" · révisions : "+(r.reps||0)+" · oublis : "+(r.lapses||0)+" · intervalle : "+r.ivl+" j"));
  }else body.append(el("p",null,countLines(sh)+" ligne(s) écrite(s). Quand veux-tu la revoir ?"));
  const miss=missingRows(sh);
  if(miss.length)body.appendChild(el("p",null,"⚠ "+miss.length+" ligne(s) écrite(s) sans texte tapé (thaï + français) : elles ne pourront pas devenir des cartes de révision."));
  const set=due=>{closeModal();scheduleSheet(sh,due);toast("Révision prévue "+fmtD(due)+" ("+inDays(due)+")",3200);};
  const q=el("div","btns");
  [[1,"Demain"],[3,"Dans 3 jours"],[7,"Dans 1 semaine"],[14,"Dans 2 semaines"]].forEach(a=>{
    const b=el("button",!on&&a[0]===3?"on":"",a[1]);b.onclick=()=>set(addDays(dstr(),a[0]));q.appendChild(b);});
  const di=document.createElement("input");di.type="date";di.min=dstr();di.value=addDays(dstr(),3);
  di.style.cssText="width:100%;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:10px";
  body.append(q,el("div","sec",on?"Changer la date":"Ou choisir une date"),di);
  const acts=[{t:"Annuler"}];
  if(miss.length)acts.push({t:"Saisir les lignes manquantes",f:()=>openRowModal(miss[0])});
  if(on){
    acts.push({t:"Rouvrir (retirer du suivi)",cls:"bad",f:()=>{if(!confirm("Retirer « "+sh.name+" » du suivi de révision ?"))return;sh.rev=null;markDirty(sh,[]);refreshBar();toast("Feuille rouverte");}});
    acts.push({t:"Réviser maintenant",f:()=>openGrade(sh)});
  }
  acts.push({t:on?"Changer la date":"Terminer",cls:"on",keep:true,f:()=>{
    if(!di.value){toast("Choisis une date");return;}
    if(di.value<dstr()){toast("Cette date est déjà passée");return;}
    set(di.value);}});
  openModal(on?"Feuille terminée":"Terminer « "+sh.name+" »",body,acts);
}
function openGrade(sh){
  const r=sh.rev;if(!r)return;
  const ko=countKo(sh),body=el("div");body.style.display="contents";
  body.append(el("p",null,"Révision prévue "+inDays(r.due)+" ("+fmtD(r.due)+")"+(ko?" · "+ko+" ligne(s) marquée(s) ✗":"")+"."),
    el("p",null,"Réécris ou relis la feuille (astuce : vues « 2+3 » ou « 3+4 » avec la réponse masquée), puis note comment ça s'est passé. Le délai affiché est celui de la prochaine révision."));
  const nm=["Encore","Difficile","Bien","Facile"],cl=["bad","","on",""],acts=[{t:"Plus tard"}];
  for(let g=0;g<4;g++)acts.push({t:nm[g]+" · "+nextIvl(r,g)+" j",cls:cl[g],f:()=>{const d=gradeSheet(sh,g);toast("Prochaine révision : "+fmtD(d)+" ("+inDays(d)+")",3200);}});
  openModal("Réviser « "+sh.name+" »",body,acts);
}
function openRevisions(){
  const body=el("div");body.style.display="contents";
  const t=dstr(),L=S.log[t]||{n:0,r:0,s:0},done=(L.n||0)+(L.r||0),goal=S.goal||10;
  const bar=(v,h)=>{const o=el("div");o.style.cssText="flex:1;height:"+h+"px;border-radius:"+(h/2)+"px;background:#e5e5ea;overflow:hidden";
    const f=el("div");f.style.cssText="height:100%;width:"+Math.min(100,Math.round(v/goal*100))+"%;background:"+(v>=goal?"var(--ok)":"var(--acc)");o.appendChild(f);return o;};
  const goTo=(sh,fn)=>{closeModal();switchSheet(sh.id);setTimeout(()=>fn(sh),30);};
  const item=(txt,cls,fn)=>{const b=el("button",cls,txt);b.style.textAlign="left";b.onclick=fn;return b;};
  body.appendChild(el("div","sec","Aujourd'hui"));
  const pr=el("div","srow");pr.appendChild(bar(done,14));body.appendChild(pr);
  body.appendChild(el("p",null,done+" / "+goal+" lignes ("+(L.n||0)+" nouvelles, "+(L.r||0)+" révisées)"+(done>=goal?" — objectif atteint ✓":"")));
  let streak=0;for(let i=0;i<70;i++){const x=S.log[addDays(t,-i)],v=x?(x.n||0)+(x.r||0):0;if(v>=goal)streak++;else if(i===0)continue;else break;}
  if(streak)body.appendChild(el("p",null,"Série : "+streak+" jour(s) de suite"));
  const gb=el("button",null,"Objectif : "+goal+" lignes par jour (modifier)");
  gb.onclick=()=>{const v=parseInt(prompt("Objectif de lignes par jour :",goal),10);if(v>0){S.goal=clamp(v,1,500);saveMeta();openRevisions();}};
  body.appendChild(gb);
  const due=sheets.filter(isDue).sort((a,b)=>a.rev.due<b.rev.due?-1:1);
  body.appendChild(el("div","sec","À revoir aujourd'hui ("+due.length+")"));
  if(!due.length)body.appendChild(el("p",null,"Rien à revoir pour l'instant 🎉"));
  due.forEach(sh=>body.appendChild(item("🔔 "+sh.name+" · "+inDays(sh.rev.due)+" · "+countLines(sh)+" lignes","on",()=>goTo(sh,openGrade))));
  const up=sheets.filter(sh=>sh.rev&&sh.rev.on&&!isDue(sh)).sort((a,b)=>a.rev.due<b.rev.due?-1:1);
  if(up.length){body.appendChild(el("div","sec","À venir"));
    up.forEach(sh=>body.appendChild(item("✅ "+sh.name+" · "+fmtD(sh.rev.due)+" ("+inDays(sh.rev.due)+")","",()=>goTo(sh,openFinish))));}
  const pend=sheets.filter(sh=>!(sh.rev&&sh.rev.on)&&countLines(sh)>0);
  if(pend.length){body.appendChild(el("div","sec","Pas encore terminées"));
    pend.forEach(sh=>body.appendChild(item("📝 "+sh.name+" · "+countLines(sh)+" lignes","",()=>goTo(sh,openFinish))));}
  body.appendChild(el("div","sec","7 derniers jours"));
  for(let i=6;i>=0;i--){
    const d=addDays(t,-i),x=S.log[d]||{n:0,r:0},v=(x.n||0)+(x.r||0),row=el("div","srow");
    const lab=el("span",null,fmtD(d));lab.style.cssText="width:92px;font-size:13px;color:var(--mut)";
    const num=el("span",null,String(v));num.style.cssText="width:34px;text-align:right;font-size:13px";
    row.append(lab,bar(v,10),num);body.appendChild(row);}
  openModal("Révisions",body,[{t:"Fermer",cls:"on"}]);
}

/* ═══════════════ démarrage ═══════════════ */
async function boot(){
  const legacyFmt=[];
  await store.open();
  try{
    const meta=await store.get("meta");
    if(meta&&Array.isArray(meta.ids)){
      Object.assign(S,meta.S||{});
      for(const id of meta.ids){
        const sh=await store.get("sheet:"+id); if(!sh) continue;
        if(sh.fmt===2) sh.cells=await store.rangeAll(cellKey(id,""));
        else{sh.cells=sh.cells||{}; legacyFmt.push(sh);}
        sheets.push(sh);
      }
    }
  }catch(e){console.error("lecture",e);}
  S.colW={...DEF_COLW,...(S.colW||{})};
  let migrated=0;
  if(!sheets.length){
    try{
      const raw=localStorage.getItem("ficheThaiMultiV4");
      if(raw){
        let widths=null; try{widths=JSON.parse(localStorage.getItem("ficheThaiColWidthsV3")||"null");}catch(_){}
        const ls=legacySheets(JSON.parse(raw),widths);
        if(ls.length){sheets=ls;migrated=ls.length; if(widths) for(let i=1;i<=8;i++) if(typeof widths[i]==="number") S.colW[i]=clamp(widths[i],MINW,MAXW);}
      }
    }catch(e){console.warn("migration",e);}
  }
  if(!sheets.length) sheets.push(newSheet("Feuille 1"));
  cur=sheets.find(s=>s.id===S.sheet)||sheets[0]; S.sheet=cur.id;
  if(!(S.view>=0&&S.view<VIEWS.length)) S.view=0;
  fillSelects();
  sheets.forEach(s=>{if(migrated)markDirty(s);}); legacyFmt.forEach(s=>markDirty(s));
  buildStage(); fit(); refreshBar(); setSave(store.mode==="mem"?"err":"ok");
  saveMeta();
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  if(store.mode==="mem") toast("⚠ Stockage indisponible : exporte régulièrement (⋯ › Exporter)",6000);
  else if(migrated) toast(migrated+" ancienne(s) feuille(s) reprise(s) automatiquement",4000);
  else if(sheets.some(isDue)) toast("🔔 "+sheets.filter(isDue).length+" feuille(s) à revoir aujourd'hui (📅 Révisions)",5000);
  else if(needBackup()) toast("Pense à exporter une sauvegarde (⋯ › Exporter)",4000);
}
boot();
})();
</script>
