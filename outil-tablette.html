<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnet Thaï">
<meta name="theme-color" content="#0284c7">
<link rel="icon" href="data:,">
<script>try{var u=JSON.parse(localStorage.getItem("carnet.ui")||'"auto"'),pm=JSON.parse(localStorage.getItem("carnet.pageMode")||'"normal"'),dk=u==="dark"||(u==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=dk?"dark":"light";document.documentElement.dataset.page=pm}catch(e){}</script>
<title>Mon Carnet Thaï</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5f5f4;--panel:#fff;--panel-2:#fafaf9;--border:#e7e5e4;--border-2:#d6d3d1;--text:#1c1917;--muted:#78716c;--accent:#0284c7;--accent-2:#0369a1;--danger:#dc2626;--success:#16a34a;--warning:#ca8a04;--radius:10px;--shadow:0 2px 8px rgba(0,0,0,.08);--shadow-lg:0 8px 24px rgba(0,0,0,.14);--fill:#0284c7;--canvas:#d6d3d1;--ok-bg:#dcfce7;--warn-bg:#fef3c7;--err-bg:#fee2e2;color-scheme:light}
:root[data-theme=dark]{--bg:#0f1115;--panel:#1a1d23;--panel-2:#22262e;--border:#2e333c;--border-2:#3b414d;--text:#e7e5e4;--muted:#a09a94;--accent:#38bdf8;--accent-2:#0ea5e9;--fill:#0369a1;--canvas:#0b0c0e;--success:#4ade80;--warning:#fbbf24;--ok-bg:#12301d;--warn-bg:#3a2e0c;--err-bg:#3b1414;--shadow:0 2px 8px rgba(0,0,0,.5);--shadow-lg:0 8px 24px rgba(0,0,0,.6);color-scheme:dark}
:root[data-page=dark] .paper,:root[data-page=dark] .thumb canvas{filter:invert(.92) hue-rotate(180deg)}
:root[data-page=dark] .paper{box-shadow:none}
:root[data-theme=dark] .stage,:root[data-page=dark] .stage{outline:1px solid var(--border-2)}
:root[data-page=sepia] .paper,:root[data-page=sepia] .thumb canvas{filter:sepia(.28) saturate(.9) brightness(.97)}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:.9rem;line-height:1.45}
header.top{height:56px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px;flex-shrink:0}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--accent)}
.logo .icon{width:30px;height:30px;border-radius:8px;background:var(--fill);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
.breadcrumb{flex:1;min-width:0;padding:0 8px;font-size:.9rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.breadcrumb strong{color:var(--text)} .breadcrumb .link{color:var(--accent);cursor:pointer}
.hdr-right{display:flex;gap:6px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font:inherit;font-size:.85rem;font-weight:500;white-space:nowrap;touch-action:manipulation}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{background:var(--fill);border-color:var(--fill);color:#fff}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.icon{padding:8px;min-width:38px;justify-content:center}
.btn.small{padding:6px 10px;font-size:.8rem}
.status{font-size:.78rem;color:var(--success);padding:4px 10px;border-radius:var(--radius);background:var(--ok-bg);border:1px solid var(--success);display:flex;align-items:center;gap:6px;white-space:nowrap}
.status .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.status.dirty,.status.saving{color:var(--warning);background:var(--warn-bg);border-color:var(--warning)}
.status.error{color:var(--danger);background:var(--err-bg);border-color:var(--danger)}
main.content{flex:1;min-height:0;position:relative;overflow:hidden}
/* Bibliothèque */
.library{height:100%;overflow-y:auto;padding:24px 20px 60px;-webkit-overflow-scrolling:touch}
.lib-head{max-width:960px;margin:0 auto 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lib-head h1{font-size:1.5rem;margin:0}
.lib-head .acts{display:flex;gap:8px;flex-wrap:wrap}
.grid{max-width:960px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;position:relative;box-shadow:var(--shadow);min-height:150px;display:flex;flex-direction:column}
.card:active{border-color:var(--accent)}
.card .ic{font-size:1.5rem;margin-bottom:10px;width:44px;height:44px;border-radius:8px;background:var(--fill);color:#fff;display:flex;align-items:center;justify-content:center}
.card .nm{font-weight:600;margin-bottom:6px;word-break:break-word}
.card .meta{font-size:.75rem;color:var(--muted);margin-top:auto}
.card .acts{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.mini{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;padding:0}
.mini:active{background:var(--accent);color:#fff}
@media (hover:hover){.card .acts{opacity:0;transition:opacity .15s}.card:hover .acts{opacity:1}}
.card.new{border:2px dashed var(--border-2);background:transparent;box-shadow:none;align-items:center;justify-content:center;gap:6px;color:var(--muted)}
.card.new .plus{font-size:2rem;line-height:1}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px 10px}
/* Éditeur */
.editor{height:100%;display:flex;flex-direction:column;background:var(--canvas);position:relative}
.toolbar{height:58px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 10px;gap:8px;flex-shrink:0}
.tscroll{flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none}
.tscroll::-webkit-scrollbar{display:none}
.tpin{display:flex;gap:6px;flex-shrink:0;padding-left:8px;border-left:1px solid var(--border)}
.tgroup{display:flex;gap:2px;background:var(--panel-2);padding:3px;border-radius:8px;border:1px solid var(--border);flex-shrink:0}
.tool-btn{width:40px;height:40px;border:none;background:transparent;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text);touch-action:manipulation;flex-shrink:0}
.tool-btn.active{background:var(--fill);color:#fff}
.tool-btn.sm{width:34px;height:34px;font-size:15px}
.tool-btn.off{opacity:.3}
.divider{width:1px;height:30px;background:var(--border);flex-shrink:0}
.colors{display:flex;gap:6px;align-items:center;flex-shrink:0;padding:0 4px}
.cdot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);cursor:pointer;padding:0;flex-shrink:0}
.cdot.active{border-color:var(--accent);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
input[type=color]{width:28px;height:28px;border:none;padding:0;background:transparent;cursor:pointer;flex-shrink:0;-webkit-appearance:none;appearance:none}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:2px solid var(--border);border-radius:50%}
input[type=color]::-moz-color-swatch{border:2px solid var(--border);border-radius:50%}
.thick{display:flex;align-items:center;gap:6px;flex-shrink:0}
.thick input{width:90px}
.thick span{font-size:.8rem;color:var(--muted);min-width:18px;text-align:center}
.body{flex:1;min-height:0;display:flex}
.side{background:var(--panel);overflow-y:auto;flex-shrink:0;padding:10px 8px;display:flex;flex-direction:column;gap:8px}
.side.pages{width:128px;border-right:1px solid var(--border)}
.side.layers{width:190px;border-left:1px solid var(--border);gap:6px}
.side.collapsed{display:none}
.side h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:4px 4px 6px}
.thumb{border:2px solid transparent;border-radius:6px;overflow:hidden;cursor:pointer;position:relative;background:#fff;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.15);min-height:60px}
.thumb.active{border-color:var(--accent)}
.thumb canvas{width:100%;display:block;pointer-events:none;background:#fff}
.thumb .num{position:absolute;bottom:3px;left:4px;font-size:.7rem;font-weight:600;background:var(--panel);color:var(--text);padding:0 5px;border-radius:3px}
.thumb .tb{position:absolute;top:3px;right:3px;display:flex;gap:3px}
.thumb .tb button{width:24px;height:24px;border:none;border-radius:5px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:0;cursor:pointer}
@media (hover:hover){.thumb .tb{display:none}.thumb:hover .tb{display:flex}}
.layer{display:flex;align-items:center;gap:4px;padding:5px 6px;border-radius:6px;background:var(--panel-2);border:1px solid var(--border);font-size:.8rem}
.layer.active{border-color:var(--accent);background:rgba(2,132,199,.07)}
.layer .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;padding:6px 2px}
.layer button{width:28px;height:28px;border:none;background:transparent;color:var(--text);border-radius:5px;cursor:pointer;font-size:14px;padding:0}
.layer button:active{background:rgba(0,0,0,.08)}
.vp{flex:1;min-width:0;overflow:auto;background:var(--canvas);touch-action:none;position:relative}
.pad{display:flex;width:max-content;min-width:100%;padding:16px;justify-content:center}
.stage{position:relative;flex:none}
.paper{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.paper .bg,.paper canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.pagenav{height:46px;background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px;flex-shrink:0;font-size:.85rem;color:var(--muted)}
.nav-btn{min-width:36px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:15px;padding:0 8px;touch-action:manipulation}
.nav-btn:disabled{opacity:.3}
.nav-btn.on{background:var(--fill);border-color:var(--fill);color:#fff}
.zoomlbl{min-width:58px;font-variant-numeric:tabular-nums}
.pagenav .sep{width:1px;height:24px;background:var(--border);margin:0 6px}
.pagenav b{color:var(--text)}
.selbar{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);z-index:20;display:flex;gap:6px;padding:6px;background:var(--panel);border-radius:12px;box-shadow:var(--shadow-lg)}
/* modales */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
.overlay.open{display:flex}
.box{background:var(--panel);color:var(--text);border-radius:14px;padding:20px;max-width:460px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);-webkit-user-select:text;user-select:text}
.box h2{margin:0 0 14px;font-size:1.1rem}
.box input[type=text]{width:100%;padding:11px 12px;color:var(--text);border:1px solid var(--border);border-radius:8px;font:inherit;background:var(--panel-2);margin-bottom:6px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.menu-list{display:flex;flex-direction:column;gap:6px}
.menu-item{justify-content:flex-start;width:100%;padding:11px 14px;font-size:.9rem}
.menu-sep{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:10px 2px 0}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}.seg .btn{flex:1;justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:rgba(28,25,23,.92);color:#fff;padding:10px 16px;border-radius:10px;font-size:.85rem;opacity:0;pointer-events:none;transition:all .2s;z-index:2000;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.box textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;font:inherit;background:var(--panel-2);color:var(--text);margin:8px 0 2px;resize:vertical;min-height:80px}
.sheet{position:fixed;inset:0;z-index:900;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.sheet-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.sheet-head h2{margin:0;font-size:1.1rem}
.sp{flex:1}
.sheet-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.sheet input,.sheet textarea{-webkit-user-select:text;user-select:text}
.sheet-tools input{flex:1;min-width:170px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel-2);color:var(--text);font:inherit;font-size:16px}
.sheet-body{flex:1;overflow-y:auto;padding:16px 14px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;align-content:start;-webkit-overflow-scrolling:touch}
.xcard{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);min-width:0}
.xcard.focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.xhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.xbadge{font-size:.72rem;font-weight:600;color:#fff;padding:2px 9px;border-radius:99px}
.xbadge.todo{background:transparent;color:var(--warning);border:1px solid var(--warning)}
.xcard img,.xprev{width:100%;display:block;border-radius:6px;border:1px solid var(--border);background:#fff}
.xprev{max-height:42vh;object-fit:contain;margin-bottom:8px}
.xlabel{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
.xlabel>div{display:flex;gap:6px}
.xnote{white-space:pre-wrap;font-size:.95rem;line-height:1.4;cursor:pointer;padding:8px 10px;border-radius:8px;background:var(--panel-2);border:1px solid var(--border)}
.xnote.empty{color:var(--muted);font-style:italic}
.xacts{display:flex;gap:6px;flex-wrap:wrap}
:root[data-page=dark] .xcard img,:root[data-page=dark] .xprev{filter:invert(.92) hue-rotate(180deg)}
:root[data-page=sepia] .xcard img,:root[data-page=sepia] .xprev{filter:sepia(.28) saturate(.9) brightness(.97)}
@media (max-width:760px){.btn .label{display:none}.side.pages{width:92px}.side.layers{width:160px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><div class="icon">ก</div><span>Carnet</span></div>
    <div class="breadcrumb" id="breadcrumb"></div>
    <div class="hdr-right">
      <div class="status" id="status"><span class="dot"></span><span id="statusTxt">Prêt</span></div>
      <button class="btn" id="backupBtn" title="Télécharger une sauvegarde complète (.json)">💾 <span class="label">Sauvegarde</span></button>
      <button class="btn icon" id="themeBtn" title="Apparence : mode sombre, sépia">🌓</button>
      <button class="btn icon" id="menuBtn" title="Menu">☰</button>
    </div>
  </header>
  <main class="content">
    <section class="library" id="library">
      <div class="lib-head"><h1>📚 Mes carnets</h1>
        <div class="acts">
          <button class="btn" id="libXBtn">🗂 Mes extraits</button>
          <button class="btn" id="libPdfBtn">📄 Nouveau carnet depuis un PDF</button>
          <button class="btn" id="libImportBtn">📥 Importer une sauvegarde</button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </section>
    <section class="editor hidden" id="editor">
      <div class="toolbar" id="toolbar"><div class="tscroll">
        <button class="btn small" id="backBtn">← <span class="label">Carnets</span></button>
        <div class="divider"></div>
        <div class="tgroup" id="tools">
          <button class="tool-btn active" data-tool="pen" title="Stylo (P)">✏️</button>
          <button class="tool-btn" data-tool="highlighter" title="Surligneur (H)">🖍️</button>
          <button class="tool-btn" data-tool="eraser" title="Gomme (E)">🧽</button>
          <button class="tool-btn" data-tool="stroke" title="Gomme de traits : efface le trait entier">⌫</button>
          <button class="tool-btn" data-tool="lasso" title="Lasso : sélectionner, déplacer, supprimer (L)">✂️</button>
          <button class="tool-btn" data-tool="extract" title="Extraire une zone vers « Mise au propre » (X)">📌</button>
        </div>
        <div class="colors" id="colors">
          <button class="cdot active" data-color="#1c1917" style="background:#1c1917" title="Noir"></button>
          <button class="cdot" data-color="#dc2626" style="background:#dc2626" title="Rouge"></button>
          <button class="cdot" data-color="#2563eb" style="background:#2563eb" title="Bleu"></button>
          <button class="cdot" data-color="#16a34a" style="background:#16a34a" title="Vert"></button>
          <button class="cdot" data-color="#ca8a04" style="background:#ca8a04" title="Jaune"></button>
          <input type="color" id="customColor" value="#1c1917" title="Couleur personnalisée">
        </div>
        <div class="thick"><span>●</span><input type="range" id="thick" min="1" max="20" value="3"><span id="thickVal">3</span></div>
        <div class="divider"></div>
        <button class="btn icon" id="undoBtn" title="Annuler (Ctrl+Z)" disabled>↶</button>
        <button class="btn icon" id="redoBtn" title="Rétablir (Ctrl+Y)" disabled>↷</button>
        <button class="btn icon" id="clearBtn" title="Effacer le calque actif (annulable)">🗑</button>
        <div class="divider"></div>
        <div class="tgroup" id="tpls">
          <button class="tool-btn sm" data-tpl="blank" title="Page blanche">⬜</button>
          <button class="tool-btn sm" data-tpl="dots" title="Points">⁚</button>
          <button class="tool-btn sm" data-tpl="lines" title="Lignes">≡</button>
          <button class="tool-btn sm" data-tpl="grid" title="Quadrillage">▦</button>
        </div></div>
        <div class="tpin">
          <button class="btn icon" id="xBtn" title="Mise au propre : mes extraits">🗂</button>
          <button class="btn icon" id="fingerBtn" title="Rôle du doigt">☝️</button>
          <button class="btn icon" id="pagesToggle" title="Afficher/masquer les pages">📑</button>
          <button class="btn icon" id="layersToggle" title="Afficher/masquer les calques">◧</button>
          <button class="btn icon" id="toolsBtn" title="Outils : PDF, image, export…">🛠</button>
        </div>
      </div>
      <div class="body">
        <aside class="side pages" id="pagesSide"></aside>
        <div class="vp" id="vp"><div class="pad"><div class="stage" id="stage"><div class="paper" id="paper"></div></div></div></div>
        <aside class="side layers" id="layersSide"><h3>Calques</h3><div id="layersList" style="display:flex;flex-direction:column;gap:6px"></div><button class="btn small" id="addLayerBtn">➕ Calque</button></aside>
      </div>
      <div class="selbar hidden" id="linkBar"><span class="muted" style="padding:6px 8px;align-self:center">Entoure l'explication à lier à l'extrait…</span><button class="btn small" id="linkOff">✕ Annuler</button></div>
      <div class="selbar hidden" id="selBar"><button class="btn danger small" id="selDel">🗑 Supprimer</button><button class="btn small" id="selOff">✕ Désélectionner</button></div>
      <div class="pagenav">
        <button class="nav-btn" id="prevBtn">◀</button>
        <span>Page <b id="curNum">1</b> / <span id="totNum">1</span></span>
        <button class="nav-btn" id="nextBtn">▶</button>
        <button class="nav-btn" id="addPageBtn" title="Nouvelle page après celle-ci">+</button>
        <span class="sep"></span>
        <button class="nav-btn" id="zoomOut">−</button>
        <button class="nav-btn zoomlbl" id="zoomFit" title="Ajuster à la largeur">100%</button>
        <button class="nav-btn" id="zoomIn">+</button>
        <button class="nav-btn" id="lockBtn" title="Verrouiller le zoom et la position">🔓</button>
      </div>
    </section>
  </main>
</div>
<div class="sheet hidden" id="extSheet">
  <div class="sheet-head"><h2>🗂 Mise au propre</h2><span class="muted" id="xCount"></span><span class="sp"></span>
    <button class="btn primary small" id="xReview">🧠 Réviser</button><button class="btn small" id="xClose">✕ Fermer</button></div>

<script>
(()=>{"use strict";
/* ════════════ Utilitaires ════════════ */
const $=s=>document.querySelector(s);
const RS=2, PW=794, PH=1123, MAXLAYERS=8, HIST_MAX=300;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const r1=v=>Math.round(v*10)/10;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const uid=p=>p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);
const LS={get(k,d){try{const v=localStorage.getItem("carnet."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("carnet."+k,JSON.stringify(v))}catch(e){}}};
function el(tag,p={},...kids){const e=document.createElement(tag);for(const k in p){const v=p[k];if(k==="cls")e.className=v;else if(k==="text")e.textContent=v;else if(k==="on"){for(const ev in v)e.addEventListener(ev,v[ev])}else if(k==="style")e.style.cssText=v;else e.setAttribute(k,v)}kids.flat().forEach(c=>c!=null&&e.append(c));return e}
function fmtDate(ts){if(!ts)return"";const d=new Date(ts),n=Date.now(),h=Math.floor((n-ts)/36e5),j=Math.floor((n-ts)/864e5);if(h<1)return"à l'instant";if(h<24)return"il y a "+h+" h";if(j<7)return"il y a "+j+" j";return d.toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"})}
const slug=s=>(s||"").normalize("NFC").replace(/[^\p{L}\p{N}\-_]+/gu,"-").replace(/^-+|-+$/g,"")||"carnet";
const today=()=>new Date().toISOString().slice(0,10);
const toBlob=(cv,type,q)=>new Promise(r=>cv.toBlob(r,type,q));
const blobToDataURL=b=>new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=()=>rej(f.error);f.readAsDataURL(b)});
const dataURLToBlob=u=>fetch(u).then(r=>r.blob());
async function blobToDrawable(blob){if(window.createImageBitmap){try{return await createImageBitmap(blob)}catch(e){}}return new Promise((res,rej)=>{const u=URL.createObjectURL(blob),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("Image illisible"))};i.src=u})}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("load "+src));document.head.appendChild(s)})}

/* ════════════ Toasts & modales ════════════ */
let toastT;
function toast(msg,ms=2400){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);if(ms)toastT=setTimeout(()=>t.classList.remove("show"),ms)}
const hideToast=()=>$("#toast").classList.remove("show");
let closeCur=null;
function modal(title,build){return new Promise(res=>{const ov=$("#modal"),box=$("#modalBox");box.replaceChildren(el("h2",{text:title}));const close=v=>{if(closeCur!==close)return;closeCur=null;ov.classList.remove("open");res(v)};if(closeCur)closeCur(null);closeCur=close;ov.onclick=e=>{if(e.target===ov)close(null)};build(box,close);ov.classList.add("open")})}
const ask=(title,msg,label="Confirmer",danger=false)=>modal(title,(box,close)=>box.append(el("p",{cls:"muted",text:msg}),el("div",{cls:"actions"},el("button",{cls:"btn",text:"Annuler",on:{click:()=>close(false)}}),el("button",{cls:"btn "+(danger?"danger":"primary"),text:label,on:{click:()=>close(true)}})))).then(v=>!!v);
const choose=(title,msg,btns)=>modal(title,(box,close)=>box.append(el("p",{cls:"muted",text:msg}),el("div",{cls:"actions"},btns.map(b=>el("button",{cls:"btn "+(b.cls||""),text:b.label,on:{click:()=>close(b.value)}})))));
const promptText=(title,label,value="",ok="OK")=>modal(title,(box,close)=>{const inp=el("input",{type:"text",value,maxlength:"60"});inp.addEventListener("keydown",e=>{if(e.key==="Enter")close(inp.value.trim()||null)});box.append(el("label",{cls:"muted",text:label}),inp,el("div",{cls:"actions"},el("button",{cls:"btn",text:"Annuler",on:{click:()=>close(null)}}),el("button",{cls:"btn primary",text:ok,on:{click:()=>close(inp.value.trim()||null)}})));setTimeout(()=>{inp.focus();inp.select()},60)});
const menuModal=(title,items)=>modal(title,(box,close)=>{const list=el("div",{cls:"menu-list"});items.forEach(it=>{if(it.sep)list.append(el("div",{cls:"menu-sep",text:it.sep}));else if(it.info)list.append(el("div",{cls:"muted",text:it.info}));else list.append(el("button",{cls:"btn menu-item"+(it.danger?" danger":""),text:it.label,on:{click:()=>close(it)}}))});box.append(list,el("div",{cls:"actions"},el("button",{cls:"btn",text:"Fermer",on:{click:()=>close(null)}})))}).then(it=>{if(it&&it.fn)it.fn()});
function pickFile(accept){return new Promise(res=>{const i=$("#filePicker");i.accept=accept;i.value="";i.onchange=()=>res(i.files[0]||null);i.oncancel=()=>res(null);i.click()})}
async function saveBlob(blob,name){try{if(matchMedia("(pointer:coarse)").matches&&navigator.canShare){const f=new File([blob],name,{type:blob.type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true}}}catch(e){if(e.name==="AbortError")return false}const u=URL.createObjectURL(blob),a=el("a",{href:u,download:name});document.body.append(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},4000);return true}
async function deliverFile(blob,name){const touchy=matchMedia("(pointer:coarse)").matches&&navigator.canShare;if(!touchy){await saveBlob(blob,name);return true}
  return modal("Fichier prêt",(box,close)=>box.append(el("p",{cls:"muted",text:name+" — "+(blob.size/1048576).toFixed(1)+" Mo"}),el("div",{cls:"actions"},el("button",{cls:"btn",text:"Fermer",on:{click:()=>close(false)}}),el("button",{cls:"btn primary",text:"Enregistrer / Partager",on:{click:async()=>{const ok=await saveBlob(blob,name);if(ok)close(true)}}}))))}

/* ════════════ Stockage IndexedDB ════════════ */
const MEM=new Map();
const DB={db:null,ok:false,
 open(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error("IndexedDB indisponible"));const r=indexedDB.open("carnet-thai",1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("notebooks",{keyPath:"id"});d.createObjectStore("pages",{keyPath:"id"}).createIndex("nb","nbId");d.createObjectStore("assets",{keyPath:"id"})};r.onsuccess=()=>{this.db=r.result;this.ok=true;res()};r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error("Base bloquée"))})},
 tx(stores,fn){return new Promise((res,rej)=>{if(!this.ok)return res();const t=this.db.transaction(stores,"readwrite");t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error("Transaction annulée"));try{fn(t)}catch(e){try{t.abort()}catch(_){}rej(e)}})},
 req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
 get(store,key){return this.ok?this.req(this.db.transaction(store).objectStore(store).get(key)):Promise.resolve(undefined)},
 all(store){return this.ok?this.req(this.db.transaction(store).objectStore(store).getAll()):Promise.resolve([])},
 pagesOf(nbId){return this.ok?this.req(this.db.transaction("pages").objectStore("pages").index("nb").getAll(IDBKeyRange.only(nbId))):Promise.resolve([])},
 deleteNotebook(id){return this.tx(["notebooks","pages","assets"],t=>{t.objectStore("notebooks").delete(id);const q=t.objectStore("pages").index("nb").openCursor(IDBKeyRange.only(id));q.onsuccess=()=>{const c=q.result;if(c){if(c.value.bg)t.objectStore("assets").delete(c.value.bg);c.delete();c.continue()}}})},
 async clearAll(){await this.tx(["notebooks","pages","assets"],t=>{["notebooks","pages","assets"].forEach(s=>t.objectStore(s).clear())})}
};
async function putAsset(id,blob){if(DB.ok)await DB.tx("assets",t=>t.objectStore("assets").put({id,blob}));else MEM.set(id,blob)}
async function assetBlob(id){if(!id)return null;if(DB.ok){const r=await DB.get("assets",id);return r?r.blob:null}return MEM.get(id)||null}
async function delAsset(id){if(!id)return;revokeAsset(id);if(DB.ok)await DB.tx("assets",t=>t.objectStore("assets").delete(id));else MEM.delete(id)}
const URLS=new Map();
async function assetURL(id){if(URLS.has(id))return URLS.get(id);const b=await assetBlob(id);if(!b)return null;const u=URL.createObjectURL(b);URLS.set(id,u);return u}
function revokeAsset(id){const u=URLS.get(id);if(u){URL.revokeObjectURL(u);URLS.delete(id)}}

/* ════════════ État & modèle ════════════ */
const S={notebooks:[],nb:null,pages:new Map(),pageId:null,layerIdx:0,tool:LS.get("tool","pen"),color:LS.get("color","#1c1917"),width:LS.get("width",3),zoom:1,fit:true,
 finger:LS.get("finger","auto"),penSeen:LS.get("penSeen",false),penDown:false,penUntil:0,sel:null,lock:LS.get("lock",false),linkTo:null,flash:null,prevTool:null,ui:LS.get("ui","auto"),pageMode:LS.get("pageMode","normal")};
const BB=new WeakMap();
const HIST=new Map();
const dirty={pages:new Set(),nbs:new Set()};
let saveTimer=0,saving=false;
const curPage=()=>S.pages.get(S.pageId)||null;
const curLayer=()=>{const p=curPage();return p?p.layers[S.layerIdx]||null:null};
const mkLayer=n=>({id:uid("ly"),name:n,visible:true,strokes:[]});
const newPage=(nbId,o={})=>({id:uid("pg"),nbId,w:o.w||PW,h:o.h||PH,template:o.template||"blank",bg:null,layers:[mkLayer("Calque 1"),mkLayer("Calque 2"),mkLayer("Calque 3")]});
const nbPages=nb=>nb.pageIds.map(id=>S.pages.get(id)).filter(Boolean);

function setStatus(k,msg){const e=$("#status");e.className="status "+(k==="saved"?"":k);$("#statusTxt").textContent=msg||({saved:"Enregistré",dirty:"Modifié…",saving:"Enregistrement…",error:"⚠ Non enregistré"}[k]||"")}
function schedule(){clearTimeout(saveTimer);saveTimer=setTimeout(flush,700)}
async function flush(){clearTimeout(saveTimer);if(saving){saveTimer=setTimeout(flush,300);return}if(!dirty.pages.size&&!dirty.nbs.size)return;if(!DB.ok){dirty.pages.clear();dirty.nbs.clear();setStatus("error","⚠ Stockage indisponible");return}
 saving=true;const pids=[...dirty.pages],nids=[...dirty.nbs];dirty.pages.clear();dirty.nbs.clear();setStatus("saving");
 try{await DB.tx(["pages","notebooks"],t=>{pids.forEach(id=>{const p=S.pages.get(id);if(p)t.objectStore("pages").put(p)});nids.forEach(id=>{const n=S.notebooks.find(x=>x.id===id);if(n)t.objectStore("notebooks").put(n)})});setStatus(dirty.pages.size?"dirty":"saved")}
 catch(e){pids.forEach(i=>dirty.pages.add(i));nids.forEach(i=>dirty.nbs.add(i));setStatus("error");console.error(e)}
 saving=false}
function touchPage(page){dirty.pages.add(page.id);if(S.nb){S.nb.updatedAt=Date.now();dirty.nbs.add(S.nb.id)}setStatus("dirty");schedule();queueThumbSoon(page.id);updateUndoUI()}
function touchNb(nb){nb.updatedAt=Date.now();dirty.nbs.add(nb.id);setStatus("dirty");schedule()}

/* ════════════ Dessin ════════════ */
const TPL={dots:{img:"radial-gradient(circle,#cbd5e1 1px,transparent 1px)",size:"24px 24px"},lines:{img:"linear-gradient(to bottom,transparent 27px,#e2e8f0 28px)",size:"100% 28px"},grid:{img:"linear-gradient(#e2e8f0 1px,transparent 1px),linear-gradient(90deg,#e2e8f0 1px,transparent 1px)",size:"24px 24px"}};
function drawTemplate(x,tpl,W,H,sc){if(tpl==="dots"){x.fillStyle="#cbd5e1";const st=24*sc;for(let py=12*sc;py<H;py+=st)for(let px=12*sc;px<W;px+=st){x.beginPath();x.arc(px,py,Math.max(.6,sc),0,6.2832);x.fill()}}
 else if(tpl==="lines"){x.fillStyle="#e2e8f0";const st=28*sc;for(let py=27*sc;py<H;py+=st)x.fillRect(0,py,W,Math.max(1,sc))}
 else if(tpl==="grid"){x.fillStyle="#e2e8f0";const st=24*sc;for(let px=0;px<W;px+=st)x.fillRect(px,0,Math.max(1,sc),H);for(let py=0;py<H;py+=st)x.fillRect(0,py,W,Math.max(1,sc))}}
function setStyle(x,s){x.lineCap="round";x.lineJoin="round";
 if(s.tool==="highlighter"){x.globalCompositeOperation="source-over";x.globalAlpha=.4;x.strokeStyle=x.fillStyle=s.color;x.lineWidth=s.width*3.5}
 else if(s.tool==="eraser"){x.globalCompositeOperation="destination-out";x.globalAlpha=1;x.strokeStyle=x.fillStyle="#000";x.lineWidth=s.width*4}
 else{x.globalCompositeOperation="source-over";x.globalAlpha=1;x.strokeStyle=x.fillStyle=s.color;x.lineWidth=s.width}}
const wAt=(s,p)=>s.tool==="pen"?s.width*(.4+1.2*p):(s.tool==="eraser"?s.width*4:s.width*3.5);
function dot(x,s,px,py,p){setStyle(x,s);x.beginPath();x.arc(px,py,Math.max(.5,wAt(s,p)/2),0,6.2832);x.fill()}
function piece(x,s,i,n){const P=s.pts,a=i*3;x.lineWidth=wAt(s,P[a+2]);x.beginPath();
 if(i===0){x.moveTo(P[0],P[1]);x.lineTo((P[0]+P[3])/2,(P[1]+P[4])/2)}
 else if(i===n-1){x.moveTo((P[a-3]+P[a])/2,(P[a-2]+P[a+1])/2);x.lineTo(P[a],P[a+1])}
 else{x.moveTo((P[a-3]+P[a])/2,(P[a-2]+P[a+1])/2);x.quadraticCurveTo(P[a],P[a+1],(P[a]+P[a+3])/2,(P[a+1]+P[a+4])/2)}
 x.stroke()}
function drawStroke(x,s){const P=s.pts,n=P.length/3;if(!n)return;setStyle(x,s);if(n===1){dot(x,s,P[0],P[1],P[2]);return}
 if(s.tool==="pen"){for(let i=0;i<n;i++)piece(x,s,i,n);return}
 x.beginPath();x.moveTo(P[0],P[1]);x.lineTo((P[0]+P[3])/2,(P[1]+P[4])/2);for(let i=1;i<n-1;i++)x.quadraticCurveTo(P[i*3],P[i*3+1],(P[i*3]+P[i*3+3])/2,(P[i*3+1]+P[i*3+4])/2);x.lineTo(P[n*3-3],P[n*3-2]);x.stroke()}
function bbox(s){let b=BB.get(s);if(!b){let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;const P=s.pts;for(let i=0;i<P.length;i+=3){if(P[i]<x1)x1=P[i];if(P[i]>x2)x2=P[i];if(P[i+1]<y1)y1=P[i+1];if(P[i+1]>y2)y2=P[i+1]}b=[x1,y1,x2,y2];BB.set(s,b)}return b}
function distSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-(ax+t*dx),py-(ay+t*dy))}
function strokeHit(s,x,y,r){const pad=r+s.width*(s.tool==="highlighter"?1.75:.8),b=bbox(s);if(x<b[0]-pad||x>b[2]+pad||y<b[1]-pad||y>b[3]+pad)return false;const P=s.pts;if(P.length===3)return Math.hypot(x-P[0],y-P[1])<=pad;for(let i=0;i<P.length-3;i+=3)if(distSeg(x,y,P[i],P[i+1],P[i+3],P[i+4])<=pad)return true;return false}
function shiftStroke(s,dx,dy){const P=s.pts;for(let i=0;i<P.length;i+=3){P[i]+=dx;P[i+1]+=dy}BB.delete(s)}

/* Rendu de la page à l'écran */
const paper=$("#paper"),stage=$("#stage"),vp=$("#vp");
let layerCvs=[],bgEl=null,ovCvs=null,ovCtx=null,redrawSet=new Set(),redrawRaf=0;
function redrawLayer(i){const page=curPage(),c=layerCvs[i],L=page&&page.layers[i];if(!c||!L)return;const x=c.getContext("2d");x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);x.setTransform(RS,0,0,RS,0,0);for(const s of L.strokes)drawStroke(x,s)}
function redrawSoon(i){redrawSet.add(i);if(!redrawRaf)redrawRaf=requestAnimationFrame(()=>{redrawRaf=0;redrawSet.forEach(redrawLayer);redrawSet.clear()})}
async function applyBg(page){const b=bgEl;if(!b)return;b.style.cssText="";if(page.bg){const u=await assetURL(page.bg);if(b===bgEl&&u){b.style.backgroundImage='url("'+u+'")';b.style.backgroundSize="100% 100%"}}else{const t=TPL[page.template];if(t){b.style.backgroundImage=t.img;b.style.backgroundSize=t.size}}}
function renderPage(){const page=curPage();if(!page)return;paper.replaceChildren();layerCvs=[];paper.style.width=page.w+"px";paper.style.height=page.h+"px";
 bgEl=el("div",{cls:"bg"});paper.append(bgEl);applyBg(page);
 page.layers.forEach((L,i)=>{const c=document.createElement("canvas");c.width=Math.round(page.w*RS);c.height=Math.round(page.h*RS);c.style.zIndex=i+1;c.style.display=L.visible?"block":"none";paper.append(c);layerCvs.push(c);redrawLayer(i)});
 ovCvs=document.createElement("canvas");ovCvs.width=page.w;ovCvs.height=page.h;ovCvs.style.zIndex=100;paper.append(ovCvs);ovCtx=ovCvs.getContext("2d");
 S.sel=null;lassoPts=[];showSelBar(false);setZoom(S.fit?fitZoom():S.zoom);updateTplUI()}
function fitZoom(){const p=curPage();return p&&vp.clientWidth?clamp((vp.clientWidth-34)/p.w,.2,1.6):1}
function setZoom(z){const p=curPage();if(!p)return;S.zoom=clamp(z,.2,5);stage.style.width=p.w*S.zoom+"px";stage.style.height=p.h*S.zoom+"px";paper.style.transform="scale("+S.zoom+")";$("#zoomFit").textContent=Math.round(S.zoom*100)+"%";drawOv()}
function zoomAt(z,cx,cy){const r=paper.getBoundingClientRect(),px=(cx-r.left)/S.zoom,py=(cy-r.top)/S.zoom;setZoom(z);const r2=paper.getBoundingClientRect();vp.scrollLeft+=r2.left-(cx-px*S.zoom);vp.scrollTop+=r2.top-(cy-py*S.zoom)}
function zoomCenter(f){if(S.lock){toast("🔒 Zoom verrouillé — touche le cadenas pour le modifier",1800);return}S.fit=false;const r=vp.getBoundingClientRect();zoomAt(S.zoom*f,r.left+r.width/2,r.top+r.height/2)}

/* Historique unifié (par page) */
function hist(){if(!S.pageId)return null;let h=HIST.get(S.pageId);if(!h){h={undo:[],redo:[]};HIST.set(S.pageId,h)}return h}
function pushHist(a){const h=hist();h.undo.push(a);if(h.undo.length>HIST_MAX)h.undo.shift();h.redo.length=0}
function updateUndoUI(){const h=hist();$("#undoBtn").disabled=!h||!h.undo.length;$("#redoBtn").disabled=!h||!h.redo.length}
const layerIdxById=id=>curPage().layers.findIndex(L=>L.id===id);
function applyAction(a,un){const page=curPage(),touched=new Set();
 const withLayer=(id,fn)=>{const i=layerIdxById(id);if(i<0)return;fn(page.layers[i]);touched.add(i)};
 if(a.k==="add")withLayer(a.layerId,L=>{if(un){const i=L.strokes.lastIndexOf(a.stroke);if(i>=0)L.strokes.splice(i,1)}else L.strokes.push(a.stroke)});
 else if(a.k==="del"){const by={};a.items.forEach(it=>(by[it.layerId]=by[it.layerId]||[]).push(it));for(const id in by)withLayer(id,L=>{if(un)by[id].slice().sort((p,q)=>p.idx-q.idx).forEach(it=>L.strokes.splice(Math.min(it.idx,L.strokes.length),0,it.stroke));else by[id].forEach(it=>{const i=L.strokes.indexOf(it.stroke);if(i>=0)L.strokes.splice(i,1)})})}
 else if(a.k==="mov"){const d=un?-1:1;a.items.forEach(it=>{shiftStroke(it.stroke,d*a.dx,d*a.dy);const i=layerIdxById(it.layerId);if(i>=0)touched.add(i)})}
 else if(a.k==="clr")withLayer(a.layerId,L=>{L.strokes=un?a.strokes.slice():[]});
 touched.forEach(redrawLayer)}
function afterHist(){S.sel=null;showSelBar(false);drawOv();touchPage(curPage())}
function undo(){const h=hist(),a=h&&h.undo.pop();if(!a)return;applyAction(a,true);h.redo.push(a);afterHist()}
function redo(){const h=hist(),a=h&&h.redo.pop();if(!a)return;applyAction(a,false);h.undo.push(a);afterHist()}

/* Entrées : stylo / surligneur / gomme */
function drawInput(e){const page=curPage(),L=curLayer();if(!L){toast("Aucun calque");return null}if(!L.visible){toast("Ce calque est masqué (👁)");return null}
 const idx=S.layerIdx,cvs=layerCvs[idx],x=cvs.getContext("2d"),rect=paper.getBoundingClientRect(),z=S.zoom;
 const s={tool:S.tool,color:S.color,width:S.width,pts:[]},HL=s.tool==="highlighter";
 let lx=-1e9,ly=-1e9,ps=null,snap=null,raf=0;
 if(HL){snap=document.createElement("canvas");snap.width=cvs.width;snap.height=cvs.height;snap.getContext("2d").drawImage(cvs,0,0)}

 if(LS.get("hide-pages",window.innerWidth<700))$("#pagesSide").classList.add("collapsed");if(LS.get("hide-layers",window.innerWidth<1000))$("#layersSide").classList.add("collapsed")}
function makeIcon(){try{const c=document.createElement("canvas");c.width=c.height=180;const x=c.getContext("2d");x.fillStyle="#0284c7";x.fillRect(0,0,180,180);x.fillStyle="#fff";x.font="bold 120px sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText("ก",90,98);const u=c.toDataURL("image/png");document.head.append(el("link",{rel:"apple-touch-icon",href:u}));const f=document.querySelector('link[rel="icon"]');if(f)f.href=u}catch(e){}}

/* ════════════ Mise au propre : extraits liés au cours ════════════
   Un extrait = un passage du cours (zone d'une page, avec ce qui est écrit dessus) + un type + une note tapée
   + des zones « explication » liées. L'image est figée à la création ; un bouton ramène à la page d'origine. */
const XTYPES={word:["Mot","#2563eb"],phrase:["Phrase","#15803d"],rule:["Règle","#7c3aed"],fix:["Correction","#dc2626"],trap:["Piège","#b45309"],dialog:["Dialogue","#0e7490"]};
const DAYS=[1,3,7,16,35];
const X={type:"all",q:"",scope:LS.get("xscope","nb")};
const exOf=nb=>nb.extracts||(nb.extracts=[]);
const allEx=()=>S.notebooks.flatMap(exOf);
const findEx=id=>allEx().find(x=>x.id===id);
const nbOfEx=x=>S.notebooks.find(n=>n.id===x.nbId);
const isDue=x=>!x.review||!x.review.due||x.review.due<=Date.now();
const reviewable=x=>!!(x.note||x.parts.length>1);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function saveNbQuiet(nb){if(!nb)return;dirty.nbs.add(nb.id);setStatus("dirty");schedule()}
function updateXBadge(){const n=allEx().length;$("#libXBtn").textContent="🗂 Mes extraits"+(n?" ("+n+")":"");$("#xBtn").title="Mise au propre — "+n+" extrait"+(n>1?"s":"")}
const showLinkBar=v=>$("#linkBar").classList.toggle("hidden",!v);

async function composeRegion(page,r,scale){const W=Math.max(1,Math.round(r.w*scale)),H=Math.max(1,Math.round(r.h*scale)),cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,H);
 if(page.bg){const b=await assetBlob(page.bg);if(b){const d=await blobToDrawable(b),dw=d.width,dh=d.height;x.drawImage(d,r.x/page.w*dw,r.y/page.h*dh,r.w/page.w*dw,r.h/page.h*dh,0,0,W,H);if(d.close)d.close()}}
 else{x.save();x.translate(-r.x*scale,-r.y*scale);drawTemplate(x,page.template,page.w*scale,page.h*scale,scale);x.restore()}
 paintLayers(x,page,W,H,scale,r.x,r.y);return cv}
async function makePart(page,r){const scale=Math.min(2.5,2600/Math.max(r.w,r.h)),cv=await composeRegion(page,r,scale),blob=await toBlob(cv,"image/jpeg",.9),id=uid("as");await putAsset(id,blob);const px=[cv.width,cv.height];cv.width=cv.height=1;

function extractInput(e){const page=curPage(),rect=paper.getBoundingClientRect(),z=S.zoom,pt=ev=>[clamp((ev.clientX-rect.left)/z,0,page.w),clamp((ev.clientY-rect.top)/z,0,page.h)],a=pt(e);let b=a;

 const draw=()=>{drawOv();const r=R();ovCtx.save();ovCtx.fillStyle="rgba(202,138,4,.14)";ovCtx.fillRect(r.x,r.y,r.w,r.h);ovCtx.strokeStyle="#ca8a04";ovCtx.lineWidth=2/z;ovCtx.setLineDash([8/z,5/z]);ovCtx.strokeRect(r.x,r.y,r.w,r.h);ovCtx.restore()};
 return{move(e){b=pt(e);draw()},end(e,cancel){drawOv();if(cancel)return;const r=R();if(r.w<24||r.h<16){toast("Zone trop petite — entoure le passage à extraire",2000);return}onExtractRect(page,r)}}}
async function onExtractRect(page,r){try{const part=await makePart(page,r);
 if(S.linkTo){const x=findEx(S.linkTo);S.linkTo=null;showLinkBar(false);if(!x){await delAsset(part.img);return}
  x.parts.push({...part,role:"explication"});touchNb(nbOfEx(x));setTool(S.prevTool&&S.prevTool!=="extract"?S.prevTool:"pen");toast("Explication liée ✔",1600);openSheet(x.id);return}
 await newExtract(page,part)}catch(err){console.error(err);toast("Extraction impossible : "+err.message,4000)}}
async function newExtract(page,part){const url=await assetURL(part.img),res=await xForm("Nouvel extrait",{url,canLink:true});if(!res){await delAsset(part.img);return}
 const x={id:uid("xt"),nbId:S.nb.id,type:res.type,note:res.note.trim(),parts:[{...part,role:"passage"}],createdAt:Date.now(),review:{lvl:0,due:0,n:0}};exOf(S.nb).unshift(x);touchNb(S.nb);updateXBadge();
 if(res.link){S.linkTo=x.id;showLinkBar(true);toast("Entoure maintenant l'explication ou l'annotation à lier",3500)}else toast("Extrait enregistré 📌 — 🗂 pour le retrouver",2200)}
function xForm(title,o){let type=o.type||"phrase";return modal(title,(box,close)=>{const chips=el("div",{cls:"seg"}),upd=()=>[...chips.children].forEach(b=>b.classList.toggle("primary",b.dataset.t===type));
 Object.entries(XTYPES).forEach(([k,v])=>chips.append(el("button",{cls:"btn small","data-t":k,text:v[0],on:{click:()=>{type=k;upd()}}})));
 const ta=el("textarea",{rows:"4",placeholder:"Sens, romanisation, règle, ce qu'il faut retenir…"});ta.value=o.note||"";const done=link=>close({type,note:ta.value,link});
 box.append(...[o.url?el("img",{cls:"xprev",src:o.url}):null,chips,ta,el("div",{cls:"actions"},el("button",{cls:"btn",text:"Annuler",on:{click:()=>close(null)}}),o.canLink?el("button",{cls:"btn",text:"Enregistrer + lier une explication",on:{click:()=>done(true)}}):null,el("button",{cls:"btn primary",text:"Enregistrer",on:{click:()=>done(false)}}))].filter(Boolean));upd();setTimeout(()=>ta.focus(),80)})}

const xPool=()=>(X.scope==="nb"&&S.nb)?exOf(S.nb):allEx();
const xShown=()=>xPool().filter(x=>(X.type==="all"||x.type===X.type)&&(!X.q||(x.note||"").toLowerCase().includes(X.q.toLowerCase()))).sort((a,b)=>b.createdAt-a.createdAt);
function openSheet(focusId){if(!S.nb)X.scope="all";$("#extSheet").classList.remove("hidden");renderSheet(focusId)}
function closeSheet(){$("#extSheet").classList.add("hidden")}
function renderSheet(focusId){const sh=$("#extSheet");if(sh.classList.contains("hidden"))return;
 const inEditor=!!S.nb;$("#xScope").classList.toggle("hidden",!inEditor);$("#xScope").textContent=X.scope==="nb"&&inEditor?"📕 Ce carnet":"📚 Tous les carnets";
 const pool=xPool(),shown=xShown(),todo=pool.filter(x=>!reviewable(x)).length,due=pool.filter(x=>reviewable(x)&&isDue(x)).length;
 $("#xCount").textContent=pool.length+" extrait"+(pool.length>1?"s":"")+(todo?" · "+todo+" à compléter":"");$("#xReview").textContent="🧠 Réviser"+(due?" ("+due+")":"");
 const ch=$("#xChips");ch.replaceChildren();[["all","Tous"],...Object.entries(XTYPES).map(([k,v])=>[k,v[0]])].forEach(([k,l])=>ch.append(el("button",{cls:"btn small"+(X.type===k?" primary":""),text:l,on:{click:()=>{X.type=k;renderSheet()}}})));
 const list=$("#xList");list.replaceChildren();
 if(!shown.length){list.append(el("div",{cls:"empty",text:pool.length?"Aucun résultat.":"Aucun extrait pour l'instant. Dans un carnet, choisis l'outil 📌, entoure un passage du cours : il apparaîtra ici."}));return}
 shown.forEach(x=>list.append(xCard(x,x.id===focusId)));if(focusId){const c=list.querySelector(".xcard.focus");if(c)c.scrollIntoView({block:"center"})}}
function xImg(part){const i=el("img",{alt:""});assetURL(part.img).then(u=>{if(u)i.src=u});return i}
function xCard(x,focus){const t=XTYPES[x.type]||XTYPES.phrase,nb=nbOfEx(x),body=[];
 x.parts.forEach((p,i)=>{if(i>0)body.push(el("div",{cls:"xlabel"},el("span",{text:"Explication"}),el("div",{},el("button",{cls:"mini",title:"Voir dans le cours",text:"↩",on:{click:()=>xJump(x,p)}}),el("button",{cls:"mini",title:"Retirer cette explication",text:"✕",on:{click:()=>xDelPart(x,i)}}))));body.push(xImg(p))});
 return el("div",{cls:"xcard"+(focus?" focus":""),"data-id":x.id},
  el("div",{cls:"xhead"},el("span",{cls:"xbadge",text:t[0],style:"background:"+t[1]}),!reviewable(x)?el("span",{cls:"xbadge todo",text:"à compléter"}):null,(X.scope==="all"&&nb)?el("span",{cls:"muted",text:nb.name}):null),
  body,el("div",{cls:"xnote"+(x.note?"":" empty"),text:x.note||"Ajouter une note (sens, romanisation, règle…)",on:{click:()=>xEdit(x)}}),
  el("div",{cls:"xacts"},el("button",{cls:"btn small",text:"↩ Voir dans le cours",on:{click:()=>xJump(x,x.parts[0])}}),el("button",{cls:"btn small",text:"＋ Explication",on:{click:()=>xLink(x)}}),el("button",{cls:"btn small",text:"✎ Modifier",on:{click:()=>xEdit(x)}}),el("button",{cls:"btn small",title:"Supprimer",text:"🗑",on:{click:()=>xDelete(x)}})))}
async function xEdit(x){const r=await xForm("Modifier l'extrait",{type:x.type,note:x.note});if(!r)return;x.type=r.type;x.note=r.note.trim();touchNb(nbOfEx(x));renderSheet(x.id)}
async function xDelete(x){if(!await ask("Supprimer cet extrait ?","Le passage, son explication et ta note seront supprimés. Le cours lui-même n'est pas touché.","Supprimer",true))return;const nb=nbOfEx(x);for(const p of x.parts)await delAsset(p.img);nb.extracts=exOf(nb).filter(e=>e!==x);touchNb(nb);updateXBadge();renderSheet()}
async function xDelPart(x,i){if(!await ask("Retirer cette explication ?","Seule cette zone est retirée de l'extrait.","Retirer",true))return;const p=x.parts.splice(i,1)[0];await delAsset(p.img);touchNb(nbOfEx(x));renderSheet(x.id)}
function scrollToRect(r){const pr=paper.getBoundingClientRect(),vr=vp.getBoundingClientRect();vp.scrollTop+=pr.top+r.y*S.zoom-(vr.top+vr.height*.3);if(r.w*S.zoom>vp.clientWidth)vp.scrollLeft+=pr.left+r.x*S.zoom-(vr.left+20)}
async function xJump(x,part){closeSheet();if(!S.nb||S.nb.id!==x.nbId)await openNotebook(x.nbId);if(!S.pages.has(part.src.pageId)){toast("La page d'origine n'existe plus",3000);return}
 switchPage(part.src.pageId);const f=part.src;S.flash=f;drawOv();requestAnimationFrame(()=>scrollToRect(f));setTimeout(()=>{if(S.flash===f){S.flash=null;drawOv()}},3500)}
async function xLink(x){await xJump(x,x.parts[0]);setTool("extract");S.linkTo=x.id;showLinkBar(true);toast("Entoure l'explication ou l'annotation à lier",3500)}

function grade(x,ok){const r=x.review||(x.review={lvl:0,due:0,n:0});r.n++;if(ok){r.lvl=Math.min(r.lvl+1,5);r.due=Date.now()+DAYS[r.lvl-1]*864e5}else{r.lvl=0;r.due=Date.now()+10*6e4}saveNbQuiet(nbOfEx(x))}
function startReview(){const pool=xShown().filter(reviewable);if(!pool.length){toast("Ajoute une note ou une explication à tes extraits pour pouvoir les réviser",3500);return}
 const due=pool.filter(isDue);if(due.length)runReview(shuffle(due).slice(0,20));else ask("Rien à réviser pour l'instant","Tout est à jour. Réviser quand même ?","Réviser").then(ok=>{if(ok)runReview(shuffle(pool).slice(0,20))})}
function runReview(q){let i=0,known=0;modal("Révision",(box,close)=>{const step=()=>{
 if(i>=q.length){box.replaceChildren(el("h2",{text:"Terminé 🎉"}),el("p",{cls:"muted",text:known+" retenu(s) sur "+q.length+". Les autres reviennent dans quelques minutes."}),el("div",{cls:"actions"},el("button",{cls:"btn primary",text:"Fermer",on:{click:()=>close(null)}})));renderSheet();return}
 const x=q[i],t=XTYPES[x.type]||XTYPES.phrase,ans=el("div",{cls:"hidden",style:"display:flex;flex-direction:column;gap:8px;margin-top:8px"});
 if(x.note)ans.append(el("div",{cls:"xnote",text:x.note}));x.parts.slice(1).forEach(p=>{const im=el("img",{cls:"xprev"});assetURL(p.img).then(u=>{if(u)im.src=u});ans.append(im)});
 const q0=el("img",{cls:"xprev"});assetURL(x.parts[0].img).then(u=>{if(u)q0.src=u});
 const btns=el("div",{cls:"actions hidden"},el("button",{cls:"btn",text:"À revoir",on:{click:()=>{grade(x,false);i++;step()}}}),el("button",{cls:"btn primary",text:"Je savais",on:{click:()=>{grade(x,true);known++;i++;step()}}}));
 const show=el("button",{cls:"btn primary",style:"width:100%;justify-content:center",text:"Montrer la réponse",on:{click:()=>{show.classList.add("hidden");ans.classList.remove("hidden");btns.classList.remove("hidden")}}});
 box.replaceChildren(el("h2",{text:"Révision "+(i+1)+" / "+q.length}),el("span",{cls:"xbadge",text:t[0],style:"background:"+t[1]}),el("div",{style:"height:8px"}),q0,show,ans,btns,el("div",{cls:"actions",style:"margin-top:6px"},el("button",{cls:"btn small",text:"Quitter",on:{click:()=>{close(null);renderSheet()}}})))};step()})}

/* ════════════ Apparence ════════════
   Interface : auto (suit l'appareil) / clair / sombre.  Page : normale / sombre (inversion à l'affichage) / sépia.
   L'affichage seul change : les exports PNG/PDF et les données gardent les couleurs d'origine. */
const mq=matchMedia("(prefers-color-scheme: dark)");
function applyTheme(){const dark=S.ui==="dark"||(S.ui==="auto"&&mq.matches),r=document.documentElement;r.dataset.theme=dark?"dark":"light";r.dataset.page=S.pageMode;const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=dark?"#1a1d23":"#0284c7"}
function openAppearance(){modal("Apparence",(box,close)=>{
 const row=(label,key,opts)=>{const g=el("div",{cls:"seg"});opts.forEach(([v,t])=>g.append(el("button",{cls:"btn"+(S[key]===v?" primary":""),text:t,on:{click:()=>{S[key]=v;LS.set(key,v);applyTheme();[...g.children].forEach((b,i)=>b.classList.toggle("primary",opts[i][0]===v))}}})));return el("div",{},el("div",{cls:"menu-sep",text:label}),g)};
 box.append(row("Interface","ui",[["auto","Auto"],["light","Clair"],["dark","Sombre"]]),row("Page","pageMode",[["normal","Normale"],["dark","Sombre"],["sepia","Sépia"]]),
  el("p",{cls:"muted",text:"« Page : Sombre » inverse le fond et l'encre à l'écran (noir sur blanc devient clair sur sombre). « Sépia » réchauffe le blanc. Seul l'affichage change : tes données et tes exports PNG/PDF gardent leurs couleurs d'origine."}),
  el("div",{cls:"actions"},el("button",{cls:"btn primary",text:"OK",on:{click:()=>close(null)}})))})}

/* ════════════ Démarrage ════════════ */
async function init(){applyTheme();if(mq.addEventListener)mq.addEventListener("change",applyTheme);makeIcon();bindUI();setStatus("saved","Chargement…");
 try{await DB.open();S.notebooks=await DB.all("notebooks");S.notebooks.forEach(n=>{if(!Array.isArray(n.pageIds))n.pageIds=[];if(!Array.isArray(n.extracts))n.extracts=[]});setStatus("saved");if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}
 catch(e){console.warn(e);setStatus("error","⚠ Stockage indisponible");toast("Le stockage du navigateur est indisponible : exporte souvent une sauvegarde (💾).",6000)}
 updateBreadcrumb();renderLibrary();
 const lb=LS.get("lastBackup",0);if(S.notebooks.length&&Date.now()-lb>14*864e5)setTimeout(()=>toast("💾 Pense à exporter une sauvegarde de tes carnets",4500),1500)}
window.__carnet={X,exOf,allEx,openSheet,makePart,composeRegion,S,DB,exportBackup,buildBackup,importText,importPDF,openNotebook,flush,applyAction,undo,redo,composePage,buildPDF,exportPDF,pageToJpeg,nbPages,fitZoom,setZoom,renderLibrary};
init();
})();
